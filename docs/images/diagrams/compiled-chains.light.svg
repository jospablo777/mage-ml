<text x="490" y="234" font-size="12" text-anchor="middle" font-weight="400" fill="#59636E">At each language switch the data is converted (Apache Arrow). Inside a chain it stays in memory;</text>
<text x="490" y="252" font-size="12" text-anchor="middle" font-weight="400" fill="#59636E">in a Rust chain, Polars optimizes every block&#x27;s query as one plan and computes it once.</text>
<text x="490" y="290" font-size="13" text-anchor="middle" font-weight="600" fill="#1F2328">Fewer switches, faster runs: keep the heavy steps of a pipeline in one language.</text>
