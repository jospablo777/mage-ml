<text x="24" y="150" font-size="12" text-anchor="start" font-weight="400" fill="#9198A1">A change of packages is locked in a copy first: if it does not</text>
<text x="24" y="168" font-size="12" text-anchor="start" font-weight="400" fill="#9198A1">resolve, nothing changes and uv says why. A worker on another</text>
<text x="24" y="186" font-size="12" text-anchor="start" font-weight="400" fill="#9198A1">Python gets that Python from uv, here and in exported images.</text>
<text x="24" y="214" font-size="12" text-anchor="start" font-weight="400" fill="#9198A1">Locks are checked against known vulnerabilities (OSV).</text>
