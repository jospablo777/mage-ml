# MLflow artifacts in IBM Cloud Object Storage, for MLflow servers and clients that do not
# install mage-ml. The modules are MageML's own (mage_ai/services/ibm), built into this
# package unchanged, so both always behave the same.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mlflow-ibm-cos"
version = "0.1.0"
description = "MLflow artifact store on IBM Cloud Object Storage with IAM API keys, trusted profiles or HMAC keys, on plain boto3"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
  "boto3>=1.28",
  "mlflow-skinny>=2.9",
  "requests>=2.28",
]

[project.urls]
Source = "https://github.com/jospablo777/mage-ml/tree/master/packages/mlflow-ibm-cos"

[project.entry-points."mlflow.artifact_repository"]
cos = "mlflow_ibm_cos.mlflow_cos:COSArtifactRepository"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../../mage_ai/services/ibm/__init__.py" = "mlflow_ibm_cos/__init__.py"
"../../mage_ai/services/ibm/iam.py" = "mlflow_ibm_cos/iam.py"
"../../mage_ai/services/ibm/cos.py" = "mlflow_ibm_cos/cos.py"
"../../mage_ai/services/ibm/mlflow_cos.py" = "mlflow_ibm_cos/mlflow_cos.py"
