[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mageml-engine"
version = "0.2.2"
description = "The MageML service engine (mage-service): runs exported pipelines and streams, with the standard connectors"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.maturin]
# The engine is an executable: the wheel installs it next to Python (ADR-0017).
bindings = "bin"
manifest-path = "../../mage_ai/pipeline_services/service/crates/service/Cargo.toml"
# jemalloc: about 30% less memory than the system allocator at the same throughput (a
# Kafka stream, measured 2026-11-26). Its build refuses paths with spaces, which release
# builds do not have; local builds keep the system allocator.
features = ["full", "jemalloc"]
profile = "release"
strip = true
