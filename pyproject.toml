[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mage-ml"
version = "0.9.79+ml.4"
description = "Mage is a tool for building and deploying data pipelines."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Mage", email = "eng@mage.ai" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "cachetools",
  "click>=8.3.3",
  "Faker>=40.41",
  "GitPython>=3.2,<4",
  "Jinja2>=3.1.6",
  "Pillow>=12.3.0",
  "PyGithub>=2.10,<3",
  "PyJWT>=2.13.0",
  "aiofiles>=25.1",
  "aiohttp>=3.14.3",
  "alembic>=1.7.5",
  "bcrypt>=5.0,<6",
  "cryptography>=50.0.0",
  "dask[dataframe]>=2022.2.0",
  "datadog>=0.55",
  "freezegun>=1.5.5",
  "httpx>=0.27.0",
  "inflection==0.5.1",
  "ipykernel>=6.30,<8",
  "ipython>=8.37,<10",
  "joblib>=1.1.0",
  "jupyter-server>=2.20.0",
  "jupyter-client>=8.6,<9",
  "ldap3==2.9.1",
  "memory_profiler",
  "newrelic>=13.6",
  "numpy>=2.4",
  "pandas>=3.0.5",
  "paramiko>=5.0.0",
  "polars>=2.0.0,<3",
  "protobuf>=6.0,<7",
  "psutil>=7.2,<8",
  "pyairtable>=2.3.3",
  "pyarrow>=25.0.1",
  "python-dateutil>=2.9",
  "pytz>=2022.2.1",
  "pyyaml~=6.0",
  "redis>=8.1,<9",
  "requests>=2.33.0",
  "urllib3>=2.7,<3",
  "rich>=13.9.4",
  "ruamel.yaml>=0.19,<0.20",
  "scikit-learn>=1.7,<2",
  "sentry-sdk>=2.8.0,<3.0.0",
  "setuptools>=83.0.0",
  "simplejson",
  "six>=1.15.0",
  "sqlalchemy>2.0.0,<3",
  "sqlglot[c]",
  "sqlparse>=0.6,<1",
  "terminado>=0.18.1",
  "thefuzz>=0.22.1",
  "tornado>=6.5.8",
  "typer>=0.18",
  "typing_extensions>=4.13.2",
  "watchdog>=6.0",
  "Werkzeug>=3.1.6",
]

[project.urls]
Homepage = "https://github.com/jospablo777/mage-ml"
Repository = "https://github.com/jospablo777/mage-ml"

[project.scripts]
mage = "mage_ai.cli.main:app"

[project.optional-dependencies]
ai = [
  "astor>=0.8.1",
  "langchain-classic>=1.0,<2",
  "langchain-core>=1.2.22,<2",
  "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=1.1.2,<2",
  "langsmith>=0.8.18",
  "openai>=1.82.0",
]
airtable = [
  "pyairtable>=2.3.3",
]
azure = [
  "azure-eventhub>=5.15",
  "azure-identity>=1.16.1,<2",
  "azure-keyvault-secrets>=4.11",
  "azure-keyvault-certificates>=4.11",
  "azure-mgmt-containerinstance==10.1.0",
  "azure-storage-blob>=12.31",
]
bigquery = [
  "google-cloud-bigquery>=3.46,<4",
  "db-dtypes>=1.7",
]
chroma = [
  "chromadb>=0.4.17",
]
clickhouse = [
  "clickhouse-connect>=0.10.0",
]
dbt = [
  "dbt-adapters>=1.22.5,<2",
  "dbt-bigquery>=1.10.3,<2",
  "google-cloud-aiplatform>=1.133,<2",
  "dbt-clickhouse>=1.9,<2",
  "dbt-core>=1.12.5,<2",
  "dbt-duckdb>=1.10.1,<2",
  "dbt-postgres>=1.10.0,<2",
  "dbt-redshift>=1.10.1,<2",
  "dbt-snowflake>=1.10.7,<2",
  "dbt-spark>=1.10.1,<2",
  "dbt-sqlserver>=1.9.0,<2",
  "dbt-synapse>=1.8.4,<2",
  "dbt-trino>=1.10.1,<2",
  "trino~=0.326",
]
duckdb = [
  "duckdb>=1.5.5",
]
great-expectations = [
  "great-expectations>=1.0",
]
google-cloud-storage = [
  "google-cloud-storage>=2.10,<4",
  "gspread>=5.12.4,<6",
]
hdf5 = [
  "tables>=3.11.1",
]
mongodb = [
  "pymongo>=4.6.3,<5",
]
mysql = [
  "mysql-connector-python>=9.1,<10",
]
oracle = [
  "oracledb>=26.0.1",
]
# Data validation for the @test functions of blocks: Validate(...).interrogate()
# .assert_passing() raises an AssertionError that lists the failed steps.
pointblank = [
  "pointblank>=1.0.1",
]
postgres = [
  "psycopg2-binary>=2.9.10",
  "sshtunnel>=0.4.0",
]
# The MLflow tracking client, to read runs and registered models and download artifacts
# from an MLflow server. The server itself is not installed.
mlflow = [
  "mlflow-skinny>=3.17,<4",
  # MLflow 3 saves scikit-learn models with skops by default.
  "skops>=0.16,<1",
]
qdrant = [
  "qdrant-client>=1.9,<2",
  "sentence-transformers>=5.0,<6",
  "transformers>=5.10,<6",
]
redshift = [
  "boto3>=1.42,<2",
  "redshift-connector>=2.1.14,<3",
  "lxml>=6.1,<7",
]
s3 = [
  "boto3>=1.42,<2",
  "botocore>=1.42,<2",
]
snowflake = [
  "snowflake-connector-python>=4.0.0",
]
spark = [
  "boto3>=1.42,<2",
  "botocore>=1.42,<2",
]
streaming = [
  "confluent-avro~=1.8.0",
  "elasticsearch>=8.19.3,<9",
  "influxdb_client>=1.50",
  "kafka-python>=2.3.2,<3",
  "nats-py>=2.16",
  "nkeys~=0.2.0",
  "opensearch-py>=2.8,<4",
  "pika>=1.4",
  "pymongo>=4.6.3,<5",
  "requests_aws4auth>=1.3",
  "stomp.py>=8.1,<9",
]
# R blocks need no Python packages beyond Mage's own: R, rv and rig are installed
# outside Python. `mage r setup` checks them and prints the commands that install them.
r = []
# The client of mage_ai.io.trino and Trino SQL blocks.
trino = [
  "trino~=0.326",
]
integrations = ["mage-integrations"]
# Dependency profile used by the container image.
all = [
  "mage-ml[ai]",
  "mage-ml[airtable]",
  "mage-ml[azure]",
  "mage-ml[bigquery]",
  "mage-ml[clickhouse]",
  "mage-ml[dbt]",
  "mage-ml[duckdb]",
  "mage-ml[google-cloud-storage]",
  "mage-ml[mlflow]",
  "mage-ml[mongodb]",
  "mage-ml[oracle]",
  "mage-ml[pointblank]",
  "mage-ml[postgres]",
  "mage-ml[redshift]",
  "mage-ml[s3]",
  "mage-ml[snowflake]",
  "mage-ml[spark]",
  "mage-ml[streaming]",
  "mage-ml[trino]",
  "aws-secretsmanager-caching>=1.2",
  "faster-fifo>=1.5.2,<2; sys_platform != 'win32'",
  "google-api-core>=2.30.0",
  "google-api-python-client>=2.201",
  "google-cloud-iam>=2.20.0",
  "google-cloud-pubsub>=2.30.0",
  "google-cloud-run>=0.16",
  "kubernetes>=33,<38",
  "opentelemetry-api>=1.40.0",
  "opentelemetry-exporter-otlp>=1.40.0",
  "opentelemetry-exporter-prometheus>=0.61b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.61b0",
  "opentelemetry-instrumentation-tornado>=0.61b0",
  "pinotdb>=5.7,<6",
  "prometheus_client>=0.18.0",
  "pydruid>=0.6.9",
  "pyodbc>=5.2,<6",
]

[dependency-groups]
dev = [
  "black",
  "commitizen",
  "interrogate",
  "isort",
  "mypy",
  "pandas-stubs",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pip-audit>=2.10,<3",
  "ruff",
]

[tool.uv]
required-version = ">=0.9.0"
constraint-dependencies = [
  # pyOpenSSL 22 does not bound cryptography.
  "pyopenssl>=25.1.0",
  # CVE-2026-82397, GHSA-wwv5-g3v4-889x and GHSA-8423-8fgw-73vq. Reached through
  # ipykernel, jupyter-client, jupyter-server and terminado.
  "tornado>=6.5.8",
]

[tool.uv.workspace]
members = ["mage_integrations", "vendor/singer-python"]
exclude = ["runtimes/*"]

[tool.uv.sources]
mage-integrations = { workspace = true }
singer-python = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["mage_ai*"]
exclude = ["mage_ai.frontend*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["mage_ai/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
addopts = "--import-mode=importlib"
# Deprecations fail the tests: FutureWarning from any library, and DeprecationWarning
# raised from Mage code, which includes pandas' Pandas4Warning.
filterwarnings = [
  "error::FutureWarning",
  "error::DeprecationWarning:mage_ai",
  "error::DeprecationWarning:mage_integrations",
]

[tool.isort]
profile = "black"

[tool.ruff]
# E501 threshold.
line-length = 100
# Exclude Jinja templates before Python parsing.
exclude = [
  "mage_ai/data_preparation/templates",
  "mage_ai/orchestration/db/migrations/versions",
]

[tool.ruff.lint]
# Preserve the existing bugbear exception and zip policies.
ignore = ["B006", "B904", "B905", "E203", "W605"]
select = ["B", "E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"mage_ai/orchestration/pipeline_scheduler.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
