[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mage-ml"
version = "0.9.79+ml.2"
description = "Mage is a tool for building and deploying data pipelines."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Mage", email = "eng@mage.ai" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "cachetools",
  "click>=8.3.3",
  "Faker==4.14.0",
  "GitPython==3.1.62",
  "Jinja2>=3.1.6",
  "Pillow>=12.3.0",
  "PyGithub==1.59.0",
  "PyJWT>=2.13.0",
  "aiofiles==22.1.0",
  "aiohttp>=3.14.3",
  "alembic>=1.7.5",
  "bcrypt==4.0.1",
  "cron-converter==1.2.1",
  "cryptography>=50.0.0",
  "dask[dataframe]>=2022.2.0",
  "datadog==0.44.0",
  "freezegun>=1.5.5",
  "httpx>=0.27.0",
  "inflection==0.5.1",
  "ipykernel>=6.30,<8",
  "ipython>=8.37,<10",
  "itsdangerous~=1.1.0",
  "joblib>=1.1.0",
  "jupyter-server>=2.20.0",
  "jupyter-client>=8.6,<9",
  "ldap3==2.9.1",
  "memory_profiler",
  "newrelic==8.8.0",
  "numpy>=2.0",
  "pandas>=3.0",
  "paramiko>=5.0.0",
  "polars>=1.44.2",
  "protobuf>=6.0,<7",
  "psutil==5.9.8",
  "pyairtable>=2.3.3",
  "pyarrow>=14.0.1",
  "python-dateutil==2.8.2",
  "pytz>=2022.2.1",
  "pyyaml~=6.0",
  "redis~=5.0.1",
  "requests>=2.33.0",
  "urllib3>=2.7,<3",
  "rich>=13.9.4",
  "ruamel.yaml==0.17.17",
  "scikit-learn<1.8",
  "sentry-sdk>=2.8.0,<3.0.0",
  "setuptools>=83.0.0",
  "simplejson",
  "six>=1.15.0",
  "sqlalchemy>2.0.0,<3",
  "sqlglot[rs]",
  "sqlparse>=0.6,<1",
  "terminado==0.17.1",
  "thefuzz[speedup]==0.19.0",
  "tornado>=6.5.8",
  "typer>=0.18",
  "typing_extensions>=4.13.2",
  "watchdog==4.0.0",
  "Werkzeug>=3.1.6",
]

[project.urls]
Homepage = "https://github.com/jospablo777/mage-ml"
Repository = "https://github.com/jospablo777/mage-ml"

[project.scripts]
mage = "mage_ai.cli.main:app"

[project.optional-dependencies]
ai = [
  "astor>=0.8.1",
  "langchain-classic>=1.0,<2",
  "langchain-core>=1.2.22,<2",
  "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=1.1.2,<2",
  "langsmith>=0.8.18",
  "openai>=1.82.0",
]
airtable = [
  "pyairtable>=2.3.3",
]
azure = [
  "azure-eventhub==5.11.2",
  "azure-identity>=1.16.1,<2",
  "azure-keyvault-secrets==4.6.0",
  "azure-keyvault-certificates==4.6.0",
  "azure-mgmt-containerinstance==10.1.0",
  "azure-storage-blob==12.14.1",
]
bigquery = [
  "google-cloud-bigquery~=3.30.0",
  "db-dtypes==1.2.0",
]
chroma = [
  "chromadb>=0.4.17",
]
clickhouse = [
  "clickhouse-connect>=0.10.0",
]
dbt = [
  "dbt-adapters>=1.22.5,<2",
  "dbt-bigquery>=1.10.3,<2",
  "google-cloud-aiplatform>=1.133,<2",
  "dbt-clickhouse>=1.9,<2",
  "dbt-core>=1.11,<2",
  "dbt-duckdb>=1.10.1,<2",
  "dbt-postgres>=1.10.0,<2",
  "dbt-redshift>=1.10.1,<2",
  "dbt-snowflake>=1.10.7,<2",
  "dbt-spark>=1.10.1,<2",
  "dbt-sqlserver>=1.9.0,<2",
  "dbt-synapse>=1.8.4,<2",
  "dbt-trino>=1.10.1,<2",
  "trino~=0.326",
]
great-expectations = [
  "great-expectations>=1.0",
]
google-cloud-storage = [
  "google-cloud-storage>=2.10,<4",
  "gspread==5.7.2",
]
hdf5 = [
  "tables==3.7.0; python_version < '3.11'",
  "tables==3.10.1; python_version >= '3.11'",
]
mysql = [
  "mysql-connector-python~=8.4.0; python_version < '3.11'",
  "mysql-connector-python>=9.1,<10",
]
oracle = [
  "oracledb==1.3.1; python_version < '3.12'",
  "oracledb==2.4.1; python_version >= '3.12'",
]
postgres = [
  "psycopg2-binary>=2.9.10",
  "sshtunnel>=0.4.0",
]
qdrant = [
  "qdrant-client>=1.9,<2",
  "sentence-transformers>=5.0,<6",
  "transformers>=5.10,<6",
]
redshift = [
  "boto3>=1.42,<2",
  "redshift-connector>=2.1.14,<3",
  "lxml>=6.1,<7",
]
s3 = [
  "boto3>=1.42,<2",
  "botocore>=1.42,<2",
]
snowflake = [
  "snowflake-connector-python>=4.0.0",
]
spark = [
  "boto3>=1.42,<2",
  "botocore>=1.42,<2",
]
streaming = [
  "confluent-avro~=1.8.0",
  "elasticsearch==8.15.1",
  "influxdb_client==1.36.1",
  "kafka-python>=2.3.2,<3",
  "nats-py==2.6.0",
  "nkeys~=0.2.0",
  "opensearch-py>=2.8,<4",
  "pika==1.3.1",
  "pymongo>=4.6.3,<5",
  "requests_aws4auth==1.1.2",
  "stomp.py==8.1.0",
]
integrations = ["mage-integrations"]
# Dependency profile used by the container image.
all = [
  "mage-ml[ai]",
  "mage-ml[airtable]",
  "mage-ml[azure]",
  "mage-ml[bigquery]",
  "mage-ml[clickhouse]",
  "mage-ml[dbt]",
  "mage-ml[google-cloud-storage]",
  "mage-ml[oracle]",
  "mage-ml[postgres]",
  "mage-ml[redshift]",
  "mage-ml[s3]",
  "mage-ml[snowflake]",
  "mage-ml[spark]",
  "mage-ml[streaming]",
  "aws-secretsmanager-caching==1.1.1.5",
  "duckdb>=1.5.5",
  "faster-fifo>=1.5.2,<2; sys_platform != 'win32'",
  "google-api-core>=2.30.0",
  "google-api-python-client~=2.70.0",
  "google-cloud-iam>=2.20.0",
  "google-cloud-pubsub>=2.30.0",
  "google-cloud-run~=0.10.1",
  "kubernetes==33.1.0",
  "opentelemetry-api>=1.40.0",
  "opentelemetry-exporter-otlp>=1.40.0",
  "opentelemetry-exporter-prometheus>=0.61b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.61b0",
  "opentelemetry-instrumentation-tornado>=0.61b0",
  "pinotdb>=5.7,<6",
  "prometheus_client>=0.18.0",
  "pydruid==0.6.5",
  "pyodbc>=5.2,<6",
]

[dependency-groups]
dev = [
  "black",
  "commitizen",
  "interrogate",
  "isort",
  "mypy",
  "pandas-stubs",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pip-audit>=2.10,<3",
  "ruff",
]

[tool.uv]
required-version = ">=0.9.0"
constraint-dependencies = [
  # pyOpenSSL 22 does not bound cryptography.
  "pyopenssl>=25.1.0",
  # CVE-2026-82397, GHSA-wwv5-g3v4-889x and GHSA-8423-8fgw-73vq. Reached through
  # ipykernel, jupyter-client, jupyter-server and terminado.
  "tornado>=6.5.8",
]

[tool.uv.workspace]
members = ["mage_integrations", "vendor/singer-python"]
exclude = ["runtimes/*"]

[tool.uv.sources]
mage-integrations = { workspace = true }
singer-python = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["mage_ai*"]
exclude = ["mage_ai.frontend*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["mage_ai/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
addopts = "--import-mode=importlib"

[tool.isort]
profile = "black"

[tool.ruff]
# E501 threshold.
line-length = 100
# Exclude Jinja templates before Python parsing.
exclude = [
  "mage_ai/data_preparation/templates",
  "mage_ai/orchestration/db/migrations/versions",
]

[tool.ruff.lint]
# Preserve the existing bugbear exception and zip policies.
ignore = ["B006", "B904", "B905", "E203", "W605"]
select = ["B", "E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"mage_ai/orchestration/pipeline_scheduler.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
