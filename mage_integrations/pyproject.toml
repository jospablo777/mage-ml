[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "mage-integrations"
version = "0.0.0"
description = "Data source and destination connectors for Mage."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "attrs>=24.2",
  "azure-storage-blob==12.14.1",
  "backoff",
  "charset-normalizer",
  "clickhouse-sqlalchemy>=0.3.2,<0.4",
  "couchbase>=4.6.3,<5",
  "deltalake==0.20.2",
  "elasticsearch==8.15.1",
  "facebook_business==22.0.2",
  "gnupg==2.3.1",
  "google-ads==30.0.0",
  "google-analytics-data>=0.20.0",
  "google-api-python-client==2.70.0",
  "google-cloud-bigquery~=3.30.0",
  "google-cloud-bigquery-storage==2.36.2",
  "google-cloud-storage>=2.10,<4",
  "httpx>=0.27.0",
  "httpx[http2]>=0.27.0",
  "kafka-python>=2.3.2,<3",
  "mysql-connector-python>=9.1,<10",
  "opensearch-py>=2.8,<4",
  "oracledb==1.3.1; python_version < \"3.12\"",
  "oracledb==2.4.1; python_version >= \"3.12\"",
  "paramiko>=5.0",
  "pendulum==2.1.0; python_version < \"3.12\"",
  "pendulum==3.0.0; python_version >= \"3.12\"",
  "protobuf<7,>=6.0",
  "psycopg2-binary>=2.9.10",
  "pyarrow>=14.0.1",
  "pymongo>=4.6.3,<5",
  "pymongo_schema==0.4.1",
  "python-dateutil==2.8.2",
  "python-magic==0.4.27",
  "redshift-connector>=2.1.14,<3",
  "requests>=2.33",
  "simple_salesforce~=1.12.5",
  "simplejson",
  "singer-sdk>=0.50,<1",
  "snowflake-connector-python>=4.0.0",
  "sshtunnel==0.4.0",
  "stripe==5.5.0",
  "teradatasql",
  "terminaltables==3.1.10",
  "trino~=0.326",
  "twitter-ads==11.0.0",
  "tzlocal==4.2",
  "xlsx2csv==0.8.1",
  "xmltodict==0.13.0",
  "zenpy==2.0.25",
  "singer-python==5.13.0+mage.1",
  "lxml>=6.1,<7",
  "async-timeout>=4,<6",
]

[tool.setuptools.packages.find]
include = ["mage_integrations*"]

[tool.setuptools]
include-package-data = true
