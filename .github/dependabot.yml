version: 2

updates:
  - package-ecosystem: uv
    directories:
      - /
      - /runtimes/custom-spark
      - /runtimes/livy
      - /runtimes/local-spark
      - /runtimes/lsp
      - /runtimes/pre-start
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /mage_ai/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch

  # The ColumnAtlas extension. Polars is pinned exactly: its Rust API changes between
  # minor versions, so each bump needs the crate's tests.
  - package-ecosystem: cargo
    directory: /rust/column_atlas
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
