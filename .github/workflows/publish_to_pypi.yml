name: Build and publish to PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run'
        required: true
        default: true
        type: boolean

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    # Disabled in this fork. The project is now published as `mage-ml`, and the
    # PyPI secrets referenced below still belong to the upstream `mage-ai`
    # project. Remove this line once the fork has its own PyPI project and
    # tokens.
    if: false

    steps:
    - uses: actions/checkout@master
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: python -m pip install --upgrade pip uv
    - name: Build stable distribution
      run: |
        rm -rf dist/*
        uv build
    - name: Publish distribution to Test PyPI
      if: github.event.inputs.dry_run == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        verbose: true
        skip-existing: true
    - name: Publish distribution to PyPI
      if: github.event.inputs.dry_run == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true
        skip-existing: true
