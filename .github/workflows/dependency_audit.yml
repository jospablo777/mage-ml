name: Dependency audit

on:
  pull_request:
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - pyproject.toml
      - uv.lock
      - mage_integrations/pyproject.toml
      - vendor/singer-python/pyproject.toml
      - runtimes/**
      - mage_ai/frontend/package.json
      - mage_ai/frontend/yarn.lock
      - .github/workflows/dependency_audit.yml
      - scripts/audit_dependencies.sh
      - scripts/yarn_audit.py
  push:
    branches: [master]
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - pyproject.toml
      - uv.lock
      - mage_integrations/pyproject.toml
      - vendor/singer-python/pyproject.toml
      - runtimes/**
      - mage_ai/frontend/package.json
      - mage_ai/frontend/yarn.lock
      - .github/workflows/dependency_audit.yml
      - scripts/audit_dependencies.sh
      - scripts/yarn_audit.py
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.29
      - name: Install audit tooling
        run: uv sync --locked --only-group dev
      # The accepted advisories are listed once, in the script.
      - name: Check the root lock (pip-audit and OSV, every extra)
        run: scripts/audit_dependencies.sh python

  runtime_helpers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [livy, lsp, pre-start, local-spark, custom-spark]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv and audit tooling
        run: |
          python -m pip install uv==0.11.29
          uv sync --locked --only-group dev
      - name: Check the runtime lock
        run: scripts/audit_dependencies.sh runtime ${{ matrix.runtime }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Check frontend advisories
        run: scripts/audit_dependencies.sh frontend

  # RustSec advisories for every Cargo.lock: the engine, ColumnAtlas, the Rust block SDK and
  # the playground's Rust blocks.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit the Rust dependencies
        run: scripts/audit_dependencies.sh rust
