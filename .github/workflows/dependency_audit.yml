name: Dependency audit

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - mage_ai/frontend/package.json
      - mage_ai/frontend/yarn.lock
      - .github/workflows/dependency_audit.yml
  push:
    branches: [master]
    paths:
      - pyproject.toml
      - uv.lock
      - mage_ai/frontend/package.json
      - mage_ai/frontend/yarn.lock
      - .github/workflows/dependency_audit.yml
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.29
      - name: Install audit tooling
        run: uv sync --locked --only-group dev
      - name: Export production dependencies
        run: >-
          uv export --locked --extra all --extra integrations --no-default-groups
          --no-hashes --no-emit-project --output-file /tmp/mage-runtime-requirements.txt
      - name: Check published advisories
        run: >-
          uv run --no-sync pip-audit --disable-pip --no-deps
          --requirement /tmp/mage-runtime-requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Check frontend advisories
        working-directory: mage_ai/frontend
        run: yarn audit --groups dependencies
