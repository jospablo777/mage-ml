name: Build and test

on:
  push:
    paths:
      - "mage_ai/**"
      - "mage_integrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build_and_test.yml"
  pull_request:
    paths:
      - "mage_ai/**"
      - "mage_integrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build_and_test.yml"

env:
  ENV: test_mage
  # Keep in step with ARG UV_VERSION in the Dockerfiles so CI and the images
  # resolve dependencies the same way.
  UV_VERSION: "0.11.29"

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dev tooling
        run: uv sync --locked --only-group dev
      - id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: "**/*.py"
      # Only changed files. The tree carries pre-existing violations that
      # predate the fork, so a repo-wide gate would fail on the first run.
      - name: Run pre-commit
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          uv run --no-sync pre-commit run --show-diff-on-failure \
            --files ${{ steps.changed-files.outputs.all_changed_files }}

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Build sdist and wheel
        run: uv build

  test_backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      # Sync into the setup-python interpreter. `python3 -m unittest` below and
      # the Playwright web server both resolve packages from it. --inexact
      # preserves the three packages installed after the sync, which the
      # lockfile omits.
      - name: Install dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: |
          sudo apt-get install -y freetds-dev
          uv sync --locked --group dev --extra postgres --inexact
          uv pip install --system "git+https://github.com/mage-ai/sqlglot#egg=sqlglot"
          uv pip install --system "git+https://github.com/mage-ai/singer-python.git#egg=singer-python"
          uv pip install --system mage_integrations/
      # Runs first because it is fast and covers the Git subsystem, including
      # the GitPython config-injection regression tests.
      - name: Run focused Git tests
        run: |
          python3 -m pytest \
            mage_ai/tests/data_preparation/git \
            mage_ai/tests/data_preparation/sync
      # Skips itself when the variables are unset, so it stays green on forks
      # without the service container.
      - name: Run PostgreSQL integration tests
        run: |
          python3 -m pytest mage_ai/tests/io/test_postgres_integration.py -v
        env:
          MAGE_TEST_POSTGRES_DBNAME: test
          MAGE_TEST_POSTGRES_HOST: 127.0.0.1
          MAGE_TEST_POSTGRES_PASSWORD: test
          MAGE_TEST_POSTGRES_PORT: 5432
          MAGE_TEST_POSTGRES_USER: postgres
      - name: Run unit tests
        run: |
          python3 -m unittest discover -s mage_ai --failfast
        env:
          OPENAI_API_KEY: abcdefg
      - name: Run mage integrations unit tests
        run: |
          cd mage_integrations && python3 -m unittest discover mage_integrations.tests

      # Run Playwright web UI tests only run once per workflow (Python 3.10).
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "18.18.0"
        if: matrix.python-version == '3.11'
      - name: Create Mage test project
        run: |
          python mage_ai/cli/main.py init test_project
        env:
          PYTHONPATH: ${{ env.pythonLocation }}:.
        if: matrix.python-version == '3.11'
      - name: Build frontend, start server, and run Playwright tests
        run: |
          yarn install &&
          yarn export_prod &&
          yarn playwright install chromium &&
          yarn playwright test -c playwright.config.ci.ts
        working-directory: mage_ai/frontend/
        env:
          PYTHONPATH: ${{ env.pythonLocation }}:. # Playwright tests on CI depend on the Python web server
        if: matrix.python-version == '3.11'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: mage_ai/frontend/playwright-report/
          retention-days: 3
          overwrite: true

  test_web_server_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      # Run Playwright web UI tests only run once per workflow (Python 3.10).
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.15.1"
      # playwright-windows.config.ci.ts activates venv3/Scripts before it starts
      # the server, so the environment has to be created at that path.
      - name: Create Mage test project
        env:
          UV_PROJECT_ENVIRONMENT: venv3
        run: |
          Start-Process -Wait -FilePath "C:\Program Files\Git\unins000.exe" -ArgumentList "/SILENT"
          uv sync --locked
          $env:PYTHONPATH = "${env:PYTHONPATH};${pwd}"
          uv run --no-sync python mage_ai/cli/main.py init test_project
      - name: Build frontend, start server, and run Playwright tests
        run: |
          yarn install &&
          yarn export_prod &&
          yarn playwright install chromium &&
          yarn playwright test -c playwright-windows.config.ci.ts
        working-directory: mage_ai/frontend/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: mage_ai/frontend/playwright-report/
          retention-days: 3
