name: Build and test

on:
  push:
    paths:
      - "mage_ai/**"
      - "mage_integrations/**"
      - "vendor/**"
      - "runtimes/**"
      - "rust/**"
      - "scripts/run_app.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build_and_test.yml"
  pull_request:
    paths:
      - "mage_ai/**"
      - "mage_integrations/**"
      - "vendor/**"
      - "runtimes/**"
      - "rust/**"
      - "scripts/run_app.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build_and_test.yml"

env:
  ENV: test_mage
  NODE_OPTIONS: --max-old-space-size=4096
  # Match the uv image tag in Dockerfile.
  UV_VERSION: "0.11.29"
  # Match RV_VERSION in Dockerfile.
  RV_VERSION: "0.20.0"
  # Match rust/column_atlas/rust-toolchain.toml and RUST_VERSION in Dockerfile.
  RUST_VERSION: "1.98.0"

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dev tooling
        run: uv sync --locked --only-group dev
      - name: Run pre-commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import os
          import subprocess


          def resolve(revision):
              try:
                  return subprocess.check_output(
                      ['git', 'rev-parse', '--verify', '--quiet', f'{revision}^{{commit}}'],
                      text=True,
                  ).strip()
              except subprocess.CalledProcessError:
                  return None


          base = os.environ.get('BASE_SHA') or ''
          if not base or set(base) == {'0'} or not resolve(base):
              # A tag push has no previous ref. Comparing against the merge base
              # keeps this to the commits that are not on the default branch yet,
              # instead of expanding to every file in the repository.
              default_branch = os.environ.get('DEFAULT_BRANCH') or 'master'
              try:
                  base = subprocess.check_output(
                      ['git', 'merge-base', f'origin/{default_branch}', 'HEAD'], text=True,
                  ).strip()
              except subprocess.CalledProcessError:
                  base = resolve('HEAD~1')

          if base:
              output = subprocess.check_output([
                  'git', 'diff', '--name-only', '-z', '--diff-filter=ACMR',
                  base, 'HEAD', '--', '*.py',
              ])
              files = [f'./{os.fsdecode(path)}' for path in output.split(b'\0') if path]
          else:
              files = []

          print(f'Linting {len(files)} changed file(s) against {base or "nothing"}.')

          if files:
              subprocess.run([
                  'uv', 'run', '--no-sync', 'pre-commit', 'run',
                  '--show-diff-on-failure', '--files', *files,
              ], check=True)
          PY

  rust:
    name: Rust extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/column_atlas
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/column_atlas -> target
            mage_ai/pipeline_services/service -> target
            mage_ai/data_preparation/models/block/rust/sdk -> target
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Test
        run: cargo test
      # The `mage` crate that Rust blocks build with.
      - name: Block SDK format
        working-directory: mage_ai/data_preparation/models/block/rust/sdk
        run: cargo fmt --check
      - name: Block SDK clippy
        working-directory: mage_ai/data_preparation/models/block/rust/sdk
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Block SDK tests
        working-directory: mage_ai/data_preparation/models/block/rust/sdk
        run: cargo test --release
      - name: Pipeline service format
        working-directory: mage_ai/pipeline_services/service
        run: cargo fmt --all --check
      - name: Pipeline service clippy
        working-directory: mage_ai/pipeline_services/service
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Pipeline service tests
        working-directory: mage_ai/pipeline_services/service
        run: cargo test --locked

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # uv sync compiles the ColumnAtlas extension in rust/column_atlas.
      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/column_atlas -> target
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Build sdist and wheel
        run: uv build --all-packages

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # uv sync compiles the ColumnAtlas extension in rust/column_atlas.
      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/column_atlas -> target
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --locked --group dev --extra postgres --extra mlflow --extra duckdb --extra s3 --extra mysql --extra mongodb --extra clickhouse --extra trino --extra pointblank --extra integrations
      # R 4.6 and rv for the R block tests, which run with the rv environment in
      # integration_tests/r_env. make installs its packages from rv.lock.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
          use-public-rspm: true
      - name: Install rv and the system libraries of the R environment
        run: |
          curl -fsSL "https://github.com/A2-ai/rv/releases/download/v${RV_VERSION}/rv-v${RV_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin rv
          rv --version
          cd integration_tests/r_env
          rv sysdeps --only-absent --json | python3 -c '
          import json, sys
          entries = json.load(sys.stdin)
          names = [e if isinstance(e, str) else e["name"] for e in entries]
          print(" ".join(names))' > /tmp/r-sysdeps
          if [ -s /tmp/r-sysdeps ]; then
            sudo apt-get update
            sudo apt-get install -y $(cat /tmp/r-sysdeps)
          fi
      # Same target as a local run. It starts the services in integration_tests/compose.yaml
      # and fails when any test is skipped.
      # Separate steps so a failure names its stage in the run's summary.
      - name: Start the integration services
        run: make -C integration_tests up
      - name: Install the R test environment
        run: make -C integration_tests r-env
      - name: Run integration tests
        run: make -C integration_tests ci PYTEST_ARGS='-n 4'
      # The scheduler process with many concurrent pipelines, for 150 seconds.
      - name: Run the scheduler soak test
        run: make -C integration_tests test-soak
      # The same with block fusion: chains run as stages, through crashes and retries.
      - name: Run the scheduler soak test with block fusion
        run: make -C integration_tests test-soak-fusion
      - name: Failed tests
        if: failure()
        run: python3 scripts/junit_annotations.py integration_tests/results.xml
      - name: Service states
        if: failure()
        run: >-
          docker compose -f integration_tests/compose.yaml ps --all --format json
          | python3 scripts/compose_states.py
      - name: Service logs
        if: failure()
        run: docker compose -f integration_tests/compose.yaml logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration_tests/results.xml
          retention-days: 7

  test_backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      # uv sync compiles the ColumnAtlas extension in rust/column_atlas.
      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/column_atlas -> target
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      # Tests and the Playwright server use the setup-python interpreter.
      - name: Install dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: |
          sudo apt-get update
          sudo apt-get install -y freetds-dev unixodbc-dev libmagic1 libkrb5-dev
          uv sync --locked --group dev --extra all --extra integrations \
            --extra great-expectations --extra qdrant
          uv pip check --system
      - name: Run focused Git tests
        run: |
          python3 -m pytest \
            mage_ai/tests/data_preparation/git \
            mage_ai/tests/data_preparation/sync
      - name: Run unit tests
        run: |
          python3 -m pytest mage_ai/tests mage_integrations/mage_integrations/tests vendor/singer-python/tests --junitxml=unit-results.xml
        env:
          OPENAI_API_KEY: abcdefg
      - name: Failed tests
        if: failure()
        run: python3 scripts/junit_annotations.py unit-results.xml
      # Run Playwright once per matrix.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
        if: matrix.python-version == '3.12'
      - name: Create Mage test project
        run: |
          python mage_ai/cli/main.py init test_project
        env:
          PYTHONPATH: ${{ env.pythonLocation }}:.
        if: matrix.python-version == '3.12'
      - name: Build frontend, start server, and run Playwright tests
        run: |
          yarn install --frozen-lockfile --non-interactive &&
          yarn test:unit &&
          yarn export_prod &&
          yarn playwright install --with-deps chromium &&
          yarn playwright test -c playwright.config.ci.ts &&
          yarn build-storybook &&
          yarn test:storybook
        working-directory: mage_ai/frontend/
        env:
          PYTHONPATH: ${{ env.pythonLocation }}:. # Playwright tests on CI depend on the Python web server
        if: matrix.python-version == '3.12'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ runner.os }}-${{ matrix.python-version }}
          path: mage_ai/frontend/playwright-report/
          retention-days: 3
          overwrite: true

  test_web_server_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      # uv sync compiles the ColumnAtlas extension in rust/column_atlas.
      - name: Set up Rust
        run: rustup toolchain install "$env:RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/column_atlas -> target
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      # playwright-windows.config.ci.ts activates venv3/Scripts before it starts
      # the server, so the environment has to be created at that path.
      - name: Create Mage test project
        env:
          UV_PROJECT_ENVIRONMENT: venv3
        run: |
          Start-Process -Wait -FilePath "C:\Program Files\Git\unins000.exe" -ArgumentList "/SILENT"
          uv sync --locked
          $env:PYTHONPATH = "${env:PYTHONPATH};${pwd}"
          uv run --no-sync python mage_ai/cli/main.py init test_project
      - name: Build frontend, start server, and run Playwright tests
        run: |
          yarn install --frozen-lockfile --non-interactive &&
          yarn export_prod &&
          yarn playwright install --with-deps chromium &&
          yarn playwright test -c playwright-windows.config.ci.ts
        working-directory: mage_ai/frontend/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ runner.os }}-${{ matrix.python-version }}
          path: mage_ai/frontend/playwright-report/
          retention-days: 3
