name: Build and test

on:
  push:
    branches: [master]
    paths:
      - "mage_ai/**"
      - "mage_integrations/**"
      - "integration_tests/**"
      - "vendor/**"
      - "runtimes/**"
      - "rust/**"
      - "scripts/run_app.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build_and_test.yml"
  pull_request:
    paths:
      - "mage_ai/**"
      - "mage_integrations/**"
      - "integration_tests/**"
      - "vendor/**"
      - "runtimes/**"
      - "rust/**"
      - "scripts/run_app.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build_and_test.yml"
  workflow_dispatch:

env:
  ENV: test_mage
  NODE_OPTIONS: --max-old-space-size=4096
  # Match the uv image tag in Dockerfile.
  UV_VERSION: "0.11.29"
  # Match RV_VERSION in Dockerfile.
  RV_VERSION: "0.20.0"
  # Match rust/column_atlas/rust-toolchain.toml and RUST_VERSION in Dockerfile.
  RUST_VERSION: "1.98.0"

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dev tooling
        run: uv sync --locked --only-group dev
      - name: Run pre-commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import os
          import subprocess


          def resolve(revision):
              try:
                  return subprocess.check_output(
                      ['git', 'rev-parse', '--verify', '--quiet', f'{revision}^{{commit}}'],
                      text=True,
                  ).strip()
              except subprocess.CalledProcessError:
                  return None


          base = os.environ.get('BASE_SHA') or ''
          if not base or set(base) == {'0'} or not resolve(base):
              # A tag push has no previous ref. Comparing against the merge base
              # keeps this to the commits that are not on the default branch yet,
              # instead of expanding to every file in the repository.
              default_branch = os.environ.get('DEFAULT_BRANCH') or 'master'
              try:
                  base = subprocess.check_output(
                      ['git', 'merge-base', f'origin/{default_branch}', 'HEAD'], text=True,
                  ).strip()
              except subprocess.CalledProcessError:
                  base = resolve('HEAD~1')

          if base:
              output = subprocess.check_output([
                  'git', 'diff', '--name-only', '-z', '--diff-filter=ACMR',
                  base, 'HEAD', '--', '*.py',
              ])
              files = [f'./{os.fsdecode(path)}' for path in output.split(b'\0') if path]
          else:
              files = []

          print(f'Linting {len(files)} changed file(s) against {base or "nothing"}.')

          if files:
              subprocess.run([
                  'uv', 'run', '--no-sync', 'pre-commit', 'run',
                  '--show-diff-on-failure', '--files', *files,
              ], check=True)
          PY

  rust:
    name: Rust extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/column_atlas
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/column_atlas -> target
            mage_ai/pipeline_services/service -> target
            mage_ai/data_preparation/models/block/rust/sdk -> target
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Test
        run: cargo test
      # The `mage` crate that Rust blocks build with.
      - name: Block SDK format
        working-directory: mage_ai/data_preparation/models/block/rust/sdk
        run: cargo fmt --check
      - name: Block SDK clippy
        working-directory: mage_ai/data_preparation/models/block/rust/sdk
        run: cargo clippy --release --all-targets --all-features -- -D warnings
      - name: Block SDK tests
        working-directory: mage_ai/data_preparation/models/block/rust/sdk
        run: cargo test --release --all-features
      - name: Pipeline service format
        working-directory: mage_ai/pipeline_services/service
        run: cargo fmt --all --check
      # librdkafka (the kafka feature) includes curl's header for its OAuth support.
      - name: Libraries the Kafka connector builds against
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake libcurl4-openssl-dev
      - name: Pipeline service clippy
        working-directory: mage_ai/pipeline_services/service
        # --all-features includes the Kafka connector (librdkafka, built with cmake).
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Pipeline service tests
        working-directory: mage_ai/pipeline_services/service
        run: cargo test --locked --all-features

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # uv sync compiles the ColumnAtlas extension in rust/column_atlas.
      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/column_atlas -> target
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Build sdist and wheel
        run: uv build --all-packages

  # An exported streaming service's image: the engine builds with librdkafka in Docker and
  # every library it links is in the runtime image.
  stream_export_image:
    name: Exported stream image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/column_atlas -> target
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --locked
      - name: Export a Kafka stream
        run: uv run python scripts/ci/export_stream.py "$RUNNER_TEMP/project" "$RUNNER_TEMP/export"
      - name: Build its image
        run: docker build -t stream-export "$RUNNER_TEMP/export"
      - name: Every linked library is present, and the service accepts its manifest
        run: |
          docker run --rm --entrypoint sh stream-export -c \
            'ldd /usr/local/bin/mage-service; ! ldd /usr/local/bin/mage-service | grep -q "not found"'
          docker run --rm stream-export validate
      - name: The stream blocks run with the packages the image holds
        run: >-
          docker run --rm -v "$PWD/scripts/ci:/check:ro" --entrypoint python3 stream-export
          /check/stream_worker_check.py

  # Integration tests in parallel jobs, one per group: each starts only its services.
  # "Integration" groups test external tools; "MageML" groups test MageML's own pipelines.
  integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: sql
            name: "Integration: SQL databases"
            services: postgres mysql clickhouse trino db2
            tests: integration_tests/postgres integration_tests/mysql integration_tests/clickhouse integration_tests/trino integration_tests/duckdb integration_tests/db2
            r: false
            warm: "'integration_tests/chains/test_compiled_chains.py::test_a_rust_chain_runs_compiled_with_the_outputs_of_block_by_block' 'integration_tests/postgres/test_rust_pipelines.py::test_the_pipeline_runs_as_an_exported_service'"
          - id: documents
            name: "Integration: document stores and caches"
            services: mongodb redis
            tests: integration_tests/mongodb integration_tests/redis
            r: false
            warm: ""
          - id: streaming
            name: "Integration: streaming and storage"
            services: kafka rabbitmq ibm-mq nats toxiproxy sqs pubsub opensearch influxdb activemq minio postgres mongodb mysql clickhouse
            # The stream benchmark needs this group's systems; in CI it runs smaller, as a check.
            tests: integration_tests/kafka integration_tests/rabbitmq integration_tests/ibm_mq integration_tests/nats integration_tests/sqs integration_tests/pubsub integration_tests/opensearch integration_tests/influxdb integration_tests/activemq integration_tests/streaming integration_tests/s3 integration_tests/benchmark/test_stream_benchmark.py
            r: false
            # Rust stream blocks build Polars: warmed first, so no test pays for it.
            warm: "'integration_tests/chains/test_compiled_chains.py::test_a_rust_chain_runs_compiled_with_the_outputs_of_block_by_block' 'integration_tests/postgres/test_rust_pipelines.py::test_the_pipeline_runs_as_an_exported_service'"
          - id: ml
            name: "Integration: ML and HTTP services"
            services: feast mlflow api
            # The deploy test builds a service image and deploys it to the runner's Docker.
            tests: integration_tests/feast integration_tests/mlflow integration_tests/api integration_tests/deploy
            r: false
            warm: ""
          - id: pipelines
            name: "MageML: compiled and polyglot pipelines"
            services: postgres mysql minio api
            tests: integration_tests/chains integration_tests/tutorials integration_tests/benchmark/test_fusion_benchmark.py integration_tests/benchmark/test_rust_pipeline_benchmark.py integration_tests/r
            r: true
            warm: "'integration_tests/chains/test_compiled_chains.py::test_a_rust_chain_runs_compiled_with_the_outputs_of_block_by_block' 'integration_tests/postgres/test_rust_pipelines.py::test_the_pipeline_runs_as_an_exported_service'"
          - id: study
            name: "MageML: pipeline shape study"
            # PostgreSQL only for the Rust warm-up's exported-service build.
            services: postgres
            tests: integration_tests/topologies
            r: true
            warm: "'integration_tests/chains/test_compiled_chains.py::test_a_rust_chain_runs_compiled_with_the_outputs_of_block_by_block' 'integration_tests/postgres/test_rust_pipelines.py::test_the_pipeline_runs_as_an_exported_service'"
          - id: soak
            name: "MageML: scheduler soak"
            services: postgres redis
            tests: ""
            r: false
            warm: ""
    steps:
      - uses: actions/checkout@v5
      # uv sync compiles the ColumnAtlas extension in rust/column_atlas; exported-service
      # tests build the pipeline service engine.
      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      # One cache for the groups (the repository's caches have 10 GB), saved by one group.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
          save-if: ${{ matrix.id == 'pipelines' }}
          workspaces: |
            rust/column_atlas -> target
            mage_ai/pipeline_services/service -> target
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --locked --group dev --extra postgres --extra mlflow --extra duckdb --extra s3 --extra mysql --extra mongodb --extra clickhouse --extra trino --extra pointblank --extra streaming --extra ibm-mq --extra db2 --extra integrations
      # R 4.6 and rv for the groups with R blocks, which run with the rv environment in
      # integration_tests/r_env. make installs its packages from rv.lock.
      - name: Set up R
        if: matrix.r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
          use-public-rspm: true
      - name: Install rv and the system libraries of the R environment
        if: matrix.r
        run: |
          curl -fsSL "https://github.com/A2-ai/rv/releases/download/v${RV_VERSION}/rv-v${RV_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin rv
          rv --version
          cd integration_tests/r_env
          rv sysdeps --only-absent --json | python3 -c '
          import json, sys
          entries = json.load(sys.stdin)
          names = [e if isinstance(e, str) else e["name"] for e in entries]
          print(" ".join(names))' > /tmp/r-sysdeps
          if [ -s /tmp/r-sysdeps ]; then
            sudo apt-get update
            sudo apt-get install -y $(cat /tmp/r-sysdeps)
          fi
      - name: Install the R test environment
        if: matrix.r
        run: make -C integration_tests r-env
      # The exported Kafka stream test runs mage-service built with Kafka: librdkafka builds
      # with CMake and includes curl's header. Built before the tests, so the test's time
      # limit does not pay for librdkafka and OpenSSL. A release build, as services ship and
      # as the timing tests need; MAGE_TEST_STREAM_RELEASE makes every test use it.
      - name: Build the engine with its stream connectors
        if: matrix.id == 'streaming' || matrix.id == 'sql'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake libcurl4-openssl-dev
          cd mage_ai/pipeline_services/service
          CARGO_TARGET_DIR=target/streams cargo build -q --release -p mage-service --features kafka,rabbitmq,ibm-mq,object-store,postgres,clickhouse,nats,mongodb,sqs,pubsub,activemq,search,influxdb
          echo "MAGE_TEST_STREAM_RELEASE=1" >> "$GITHUB_ENV"
      # The IBM MQ connector loads IBM's MQ client at run time: the redistributable client,
      # the version and checksum exported images pin.
      # IBM's server refuses connections or stalls now and then, which failed the job, so the
      # client is cached by its checksum and downloaded only when the pinned version changes.
      - name: Find the IBM MQ client
        id: mq
        if: matrix.id == 'streaming'
        run: |
          read -r url sha <<< "$(uv run --no-sync python -c 'from mage_ai.pipeline_services import export as e; print(e.IBM_MQ_CLIENT_URL, e.IBM_MQ_CLIENT_SHA256)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Restore the IBM MQ client
        if: matrix.id == 'streaming'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ibm-mq
          key: ibm-mq-client-${{ steps.mq.outputs.sha }}
      - name: Download the IBM MQ client
        if: matrix.id == 'streaming'
        run: |
          archive=~/.cache/ibm-mq/mq.tar.gz
          if [ ! -f "$archive" ]; then
            mkdir -p ~/.cache/ibm-mq
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 \
              --max-time 600 -o "$archive" "${{ steps.mq.outputs.url }}"
          fi
          echo "${{ steps.mq.outputs.sha }}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mqm" && tar -xzf "$archive" -C "$RUNNER_TEMP/mqm"
          echo "MAGE_TEST_MQ_LIBRARY=$RUNNER_TEMP/mqm/lib64/libmqm_r.so" >> "$GITHUB_ENV"
      # icr.io (Db2, IBM MQ) times out for minutes at a time, which failed the job. Its images
      # are cached by tag and loaded from the cache; the registry is contacted only when a tag
      # changes, with longer waits between tries.
      - name: Find the group's icr.io images
        id: icr
        if: matrix.services != ''
        run: |
          images=$(docker compose -f integration_tests/compose.yaml config --images ${{ matrix.services }} | grep '^icr\.io/' | sort | tr '\n' ' ' || true)
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "key=icr-images-$(echo "$images" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the icr.io images
        id: icr-cache
        if: steps.icr.outputs.images != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/icr-images
          key: ${{ steps.icr.outputs.key }}
      - name: Load or pull the icr.io images
        if: steps.icr.outputs.images != ''
        run: |
          archive=~/.cache/icr-images/images.tar.zst
          if [ -f "$archive" ]; then
            zstd -dc "$archive" | docker load
            exit 0
          fi
          for image in ${{ steps.icr.outputs.images }}; do
            for attempt in 1 2 3 4 5 6; do
              docker pull -q "$image" && break
              [ "$attempt" = 6 ] && exit 1
              echo "Pulling $image failed (attempt $attempt); trying again."
              sleep $((attempt * 30))
            done
          done
          mkdir -p ~/.cache/icr-images
          docker save ${{ steps.icr.outputs.images }} | zstd -q -T0 -3 -o "$archive"
      - name: Save the icr.io images
        if: steps.icr.outputs.images != '' && steps.icr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/icr-images
          key: ${{ steps.icr.outputs.key }}
      # Registries time out now and then: three tries before failing.
      - name: Start the group's services
        if: matrix.services != ''
        run: |
          for attempt in 1 2 3; do
            make -C integration_tests up SERVICES="${{ matrix.services }}" && exit 0
            echo "Starting the services failed (attempt $attempt); trying again."
            sleep 20
          done
          exit 1
      # Rust blocks compile into one cargo target directory. Restore it, build Polars and the
      # block SDK into it before the tests, and save it at once, so no test pays for a cold
      # build within its time limit and a failing test run still keeps the cache.
      - name: Restore the Rust blocks' build directory
        if: matrix.warm != ''
        id: rust-blocks
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mage/rust/target
          key: rust-blocks-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('mage_ai/data_preparation/models/block/rust/sdk/Cargo.toml', 'mage_ai/data_preparation/models/block/rust/sdk/Cargo.lock', 'mage_ai/data_preparation/models/block/rust/workspace.py', 'integration_tests/Makefile') }}
          restore-keys: rust-blocks-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Build Polars and the Rust block SDK
        if: matrix.warm != ''
        run: make -C integration_tests warm-rust WARM_TESTS="${{ matrix.warm }}"
      # The groups warm the same builds; one of them saves the shared cache.
      - name: Save the Rust blocks' build directory
        if: matrix.id == 'pipelines' && steps.rust-blocks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/mage/rust/target
          key: ${{ steps.rust-blocks.outputs.cache-primary-key }}
      # The Kubernetes deploy test deploys to a kind cluster of its own.
      - name: Start a kind cluster
        if: matrix.id == 'ml'
        uses: helm/kind-action@v1
        with:
          cluster_name: mage-deploy-test
      - name: Run the group's tests
        if: matrix.tests != ''
        env:
          MAGE_BENCHMARK_MESSAGES: "50000"
          MAGE_TEST_KIND_CLUSTER: ${{ matrix.id == 'ml' && 'mage-deploy-test' || '' }}
        run: >-
          make -C integration_tests ci-tests TESTS="${{ matrix.tests }}"
          REPORT=results-${{ matrix.id }}.xml
          PYTEST_ARGS='-n 4 --dist loadgroup -v --timeout=900 --durations=25'
      # The scheduler process with many concurrent pipelines, for 150 seconds.
      - name: Run the scheduler soak test
        if: matrix.id == 'soak'
        run: make -C integration_tests test-soak SERVICES="${{ matrix.services }}" PYTEST_ARGS='--junitxml=integration_tests/soak-results.xml'
      # The same with block fusion: chains run as stages, through crashes and retries.
      - name: Run the scheduler soak test with block fusion
        if: matrix.id == 'soak'
        run: make -C integration_tests test-soak-fusion SERVICES="${{ matrix.services }}" PYTEST_ARGS='--junitxml=integration_tests/soak-fusion-results.xml'
      - name: Failed tests
        if: failure()
        run: python3 scripts/junit_annotations.py integration_tests/results-*.xml integration_tests/soak*-results.xml
      - name: Service states
        if: failure() && matrix.services != ''
        run: python3 scripts/compose_states.py integration_tests/compose.yaml
      - name: Service logs
        if: failure() && matrix.services != ''
        run: docker compose -f integration_tests/compose.yaml logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-${{ matrix.id }}
          path: |
            integration_tests/results-*.xml
            integration_tests/soak*-results.xml
          if-no-files-found: ignore
          retention-days: 7

  test_backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      # uv sync compiles the ColumnAtlas extension in rust/column_atlas.
      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/column_atlas -> target
      # The Rust block tests compile Polars into Mage's shared target directory; keep the
      # compiled dependencies between runs (not the incremental data or block binaries).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mage/rust/target/release/deps
            ~/.cache/mage/rust/target/release/build
            ~/.cache/mage/rust/target/release/.fingerprint
          key: rust-blocks-${{ env.RUST_VERSION }}-${{ hashFiles('mage_ai/data_preparation/models/block/rust/sdk/Cargo.toml', 'mage_ai/data_preparation/models/block/rust/workspace.py') }}
          restore-keys: rust-blocks-${{ env.RUST_VERSION }}-
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      # Tests and the Playwright server use the setup-python interpreter.
      - name: Install dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: |
          sudo apt-get update
          sudo apt-get install -y freetds-dev unixodbc-dev libmagic1 libkrb5-dev
          uv sync --locked --group dev --extra all --extra integrations \
            --extra great-expectations --extra qdrant
          uv pip check --system
      - name: Run focused Git tests
        run: |
          python3 -m pytest \
            mage_ai/tests/data_preparation/git \
            mage_ai/tests/data_preparation/sync
      - name: Run unit tests
        run: |
          python3 -m pytest mage_ai/tests mage_integrations/mage_integrations/tests vendor/singer-python/tests --junitxml=unit-results.xml
        env:
          OPENAI_API_KEY: abcdefg
          # Smaller cached target directory; CI builds each block once.
          CARGO_INCREMENTAL: "0"
      - name: Failed tests
        if: failure()
        run: python3 scripts/junit_annotations.py unit-results.xml
      # Run Playwright once per matrix.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
        if: matrix.python-version == '3.12'
      # The app as users run it: ENV=test_mage is the unit tests' mode (their SQLite
      # database in the working directory, data in the checkout), not a server's.
      - name: Create Mage test project
        run: |
          python mage_ai/cli/main.py init test_project
        env:
          ENV: ""
          PYTHONPATH: ${{ env.pythonLocation }}:.
        if: matrix.python-version == '3.12'
      - name: Build frontend, start server, and run Playwright tests
        run: |
          yarn install --frozen-lockfile --non-interactive &&
          yarn test:unit &&
          yarn export_prod &&
          yarn playwright install --with-deps chromium &&
          yarn playwright test -c playwright.config.ci.ts &&
          yarn build-storybook &&
          yarn test:storybook
        working-directory: mage_ai/frontend/
        env:
          PYTHONPATH: ${{ env.pythonLocation }}:. # Playwright tests on CI depend on the Python web server
          ENV: ""
        if: matrix.python-version == '3.12'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ runner.os }}-${{ matrix.python-version }}
          path: mage_ai/frontend/playwright-report/
          retention-days: 3
          overwrite: true

