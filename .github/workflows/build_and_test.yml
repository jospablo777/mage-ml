name: Build and test

on:
  push:
    paths:
      - "mage_ai/**"
      - "mage_integrations/**"
      - "vendor/**"
      - "runtimes/**"
      - "scripts/run_app.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build_and_test.yml"
  pull_request:
    paths:
      - "mage_ai/**"
      - "mage_integrations/**"
      - "vendor/**"
      - "runtimes/**"
      - "scripts/run_app.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build_and_test.yml"

env:
  ENV: test_mage
  NODE_OPTIONS: --max-old-space-size=4096
  # Match the uv image tag in Dockerfile.
  UV_VERSION: "0.11.29"

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dev tooling
        run: uv sync --locked --only-group dev
      - name: Run pre-commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          base = os.environ['BASE_SHA']
          if not base or set(base) == {'0'}:
              base = subprocess.check_output(
                  ['git', 'hash-object', '-t', 'tree', '/dev/null'], text=True,
              ).strip()
          output = subprocess.check_output([
              'git', 'diff', '--name-only', '-z', '--diff-filter=ACMR',
              base, 'HEAD', '--', '*.py',
          ])
          files = [f'./{os.fsdecode(path)}' for path in output.split(b'\0') if path]
          if files:
              subprocess.run([
                  'uv', 'run', '--no-sync', 'pre-commit', 'run',
                  '--show-diff-on-failure', '--files', *files,
              ], check=True)
          PY

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Build sdist and wheel
        run: uv build --all-packages

  test_backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      # Tests and the Playwright server use the setup-python interpreter.
      - name: Install dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: |
          sudo apt-get update
          sudo apt-get install -y freetds-dev unixodbc-dev libmagic1 libkrb5-dev
          uv sync --locked --group dev --extra all --extra integrations \
            --extra great-expectations --extra qdrant
          uv pip check --system
      - name: Run focused Git tests
        run: |
          python3 -m pytest \
            mage_ai/tests/data_preparation/git \
            mage_ai/tests/data_preparation/sync
      - name: Run PostgreSQL integration tests
        run: |
          python3 -m pytest mage_ai/tests/io/test_postgres_integration.py -v
        env:
          MAGE_TEST_POSTGRES_DBNAME: test
          MAGE_TEST_POSTGRES_HOST: 127.0.0.1
          MAGE_TEST_POSTGRES_PASSWORD: test
          MAGE_TEST_POSTGRES_PORT: 5432
          MAGE_TEST_POSTGRES_USER: postgres
      - name: Run unit tests
        run: |
          python3 -m pytest mage_ai/tests mage_integrations/mage_integrations/tests vendor/singer-python/tests
        env:
          OPENAI_API_KEY: abcdefg
      # Run Playwright once per matrix.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
        if: matrix.python-version == '3.12'
      - name: Create Mage test project
        run: |
          python mage_ai/cli/main.py init test_project
        env:
          PYTHONPATH: ${{ env.pythonLocation }}:.
        if: matrix.python-version == '3.12'
      - name: Build frontend, start server, and run Playwright tests
        run: |
          yarn install --frozen-lockfile --non-interactive &&
          yarn export_prod &&
          yarn playwright install --with-deps chromium &&
          yarn playwright test -c playwright.config.ci.ts &&
          yarn build-storybook &&
          yarn test:storybook
        working-directory: mage_ai/frontend/
        env:
          PYTHONPATH: ${{ env.pythonLocation }}:. # Playwright tests on CI depend on the Python web server
        if: matrix.python-version == '3.12'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ runner.os }}-${{ matrix.python-version }}
          path: mage_ai/frontend/playwright-report/
          retention-days: 3
          overwrite: true

  test_web_server_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install "uv==${{ env.UV_VERSION }}"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      # playwright-windows.config.ci.ts activates venv3/Scripts before it starts
      # the server, so the environment has to be created at that path.
      - name: Create Mage test project
        env:
          UV_PROJECT_ENVIRONMENT: venv3
        run: |
          Start-Process -Wait -FilePath "C:\Program Files\Git\unins000.exe" -ArgumentList "/SILENT"
          uv sync --locked
          $env:PYTHONPATH = "${env:PYTHONPATH};${pwd}"
          uv run --no-sync python mage_ai/cli/main.py init test_project
      - name: Build frontend, start server, and run Playwright tests
        run: |
          yarn install --frozen-lockfile --non-interactive &&
          yarn export_prod &&
          yarn playwright install --with-deps chromium &&
          yarn playwright test -c playwright-windows.config.ci.ts
        working-directory: mage_ai/frontend/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ runner.os }}-${{ matrix.python-version }}
          path: mage_ai/frontend/playwright-report/
          retention-days: 3
