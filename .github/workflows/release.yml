name: Release

# Builds the MageML wheels from a version tag, qualifies them on every supported platform
# and, only when run with publish, attaches them to a GitHub release and updates the package
# index on GitHub Pages. Nothing runs automatically. See docs/development/releasing.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, such as v0.1.0 (it must exist)'
        required: true
        type: string
      publish:
        description: 'Publish the release and the package index after qualification'
        required: true
        default: false
        type: boolean
      prerelease:
        description: 'Mark the release as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: '0.11.29'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  RUST_TOOLCHAIN: '1.98.0'
  MACOSX_DEPLOYMENT_TARGET: '12.0'

jobs:
  contract:
    name: Release contract
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.contract.outputs.commit }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Record the commit and versions
        id: contract
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "pyproject version $version does not match $TAG"; exit 1; }
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tag: $TAG"
            echo "commit: $(git rev-parse HEAD)"
            for f in pyproject.toml mage_integrations/pyproject.toml vendor/singer-python/pyproject.toml rust/column_atlas/pyproject.toml; do
              python3 -c "import tomllib,sys; p=tomllib.load(open(sys.argv[1],'rb'))['project']; print(f\"{p['name']}: {p['version']}\")" "$f"
            done
            sha256sum uv.lock rust/column_atlas/Cargo.lock mage_ai/frontend/yarn.lock
          } | tee build-receipt.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-receipt
          path: build-receipt.txt

  python:
    name: Python wheels and frontend
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build both frontend variants from this commit
        working-directory: mage_ai/frontend
        run: |
          yarn install --frozen-lockfile --non-interactive
          NODE_OPTIONS=--max-old-space-size=4096 yarn export_prod
          NODE_OPTIONS=--max-old-space-size=4096 yarn export_prod_base_path
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build the Python wheels
        run: |
          for package in mage-ml mage-integrations singer-python; do
            uv build --package "$package" --wheel --no-sources --out-dir release-wheels
          done
          ls -la release-wheels
      - name: Check the main wheel's contents
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          wheel = zipfile.ZipFile(glob.glob('release-wheels/mage_ml-*.whl')[0])
          names = wheel.namelist()
          required = ['mage_ai/server/frontend_dist/index.html',
                      'mage_ai/server/frontend_dist_base_path_template/index.html']
          missing = [n for n in required if n not in names]
          forbidden = [n for n in names if '/target/' in n or n.endswith(('.db', '.sqlite'))
                       or '/.venv/' in n or '__pycache__' in n]
          print(len(names), 'files; missing', missing, '; forbidden', forbidden[:10])
          sys.exit(1 if missing or forbidden else 0)
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-python
          path: release-wheels/*.whl
          if-no-files-found: error

  native:
    name: column-atlas-native (${{ matrix.id }})
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.commit }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: rust/column_atlas
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-native-${{ matrix.id }}
          path: rust/column_atlas/dist/*.whl
          if-no-files-found: error

  # The service engine as a platform wheel (ADR-0017): mage service run uses it, and exported
  # images can install it instead of compiling the engine. librdkafka and OpenSSL are built
  # from source and linked statically, which needs cmake and OpenSSL's perl modules.
  engine:
    name: mageml-engine (${{ matrix.id }})
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.commit }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: packages/mageml-engine
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          before-script-linux: |
            yum install -y cmake perl perl-IPC-Cmd libcurl-devel
          args: --release --locked --out dist
      - name: The engine starts
        if: matrix.id != 'linux-aarch64' || runner.arch == 'ARM64'
        run: |
          python3 -m venv /tmp/engine-check
          /tmp/engine-check/bin/pip install packages/mageml-engine/dist/*.whl
          /tmp/engine-check/bin/mage-service --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-engine-${{ matrix.id }}
          path: packages/mageml-engine/dist/*.whl
          if-no-files-found: error

  qualify:
    name: Qualify (${{ matrix.id }})
    # The engine wheels too: publish takes every wheel, so they must be done.
    needs: [contract, python, native, engine]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.commit }}
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: release-wheels
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install and run the application from the wheels
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          python3 scripts/release/qualify_install.py release-wheels --version "$VERSION" \
            --report "reports/qualify-${{ matrix.id }}.json"
      - name: The integrations extra installs
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          python3 scripts/release/qualify_install.py release-wheels --version "$VERSION" \
            --extras '[integrations]' --report "reports/qualify-${{ matrix.id }}-integrations.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualification-${{ matrix.id }}
          path: reports/

  publish:
    name: Publish the release
    if: inputs.publish
    needs: [contract, qualify]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    outputs:
      site: ${{ steps.site.outputs.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: release-wheels
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{qualification-*,build-receipt}'
          path: release-reports
          merge-multiple: true
      - name: Build the package index and installer files
        id: site
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.contract.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          previous=()
          if curl -fsSL "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/release-manifest.json" -o previous-manifest.json; then
            previous=(--previous-manifest previous-manifest.json)
          fi
          python3 scripts/release/release_index.py release-wheels --repository "$REPOSITORY" \
            --tag "$TAG" --output site "${previous[@]}"
          mkdir -p site/install
          native=$(python3 -c "import tomllib; print(tomllib.load(open('rust/column_atlas/pyproject.toml','rb'))['project']['version'])")
          integrations=$(python3 -c "import tomllib; print(tomllib.load(open('mage_integrations/pyproject.toml','rb'))['project']['version'])")
          singer=$(python3 -c "import tomllib; print(tomllib.load(open('vendor/singer-python/pyproject.toml','rb'))['project']['version'])")
          python3 scripts/release/install_requirements.py site/release-manifest.json \
            --version "$VERSION" --native-version "$native" \
            --integrations-version "$integrations" --singer-version "$singer" \
            --targets linux-x86_64 linux-aarch64 macos-arm64 --output "site/install/$TAG"
          tar -czf release-site.tar.gz site
          mkdir -p release-assets
          cp release-wheels/*.whl release-site.tar.gz release-assets/
          cp release-reports/* release-assets/
          (cd release-assets && sha256sum * > ../release-assets.sha256) && mv release-assets.sha256 release-assets/
          echo "path=site" >> "$GITHUB_OUTPUT"
      - name: Draft the release, upload and verify the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The repository this workflow runs in, by name: GitHub lists MageML as a fork of
          # mage-ai/mage-ai, and gh must never pick the parent.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.contract.outputs.version }}
          COMMIT: ${{ needs.contract.outputs.commit }}
        run: |
          # Asked of GitHub: this checkout has no local tag ref, and commits/{tag} resolves an
          # annotated tag to its commit.
          tagged="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" -q .sha)"
          test "$tagged" = "$COMMIT" || { echo "$TAG points to $tagged, not to the qualified commit $COMMIT"; exit 1; }
          cp "docs/development/releases/$TAG.md" release-notes.md
          gh release create "$TAG" --verify-tag --draft --title "MageML $VERSION" --notes-file release-notes.md
          gh release upload "$TAG" release-assets/*
          mkdir check && gh release download "$TAG" --dir check
          (cd check && sha256sum -c release-assets.sha256)
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest=false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    name: Deploy the package index
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
