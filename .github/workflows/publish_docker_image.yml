name: Build Docker image

# Builds the image and pushes it nowhere: no registry login, no push. Publishing is
# off until an account and registry are chosen. To publish, add a login step, set
# push: true and give the job packages: write.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms'
        required: true
        default: linux/amd64

permissions:
  contents: read

jobs:
  build:
    name: Build the Docker image without pushing it
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # arm64 is emulated on GitHub runners and takes hours for this image. Pass it
      # through the workflow input only when the build has time to finish.
      - name: Set up QEMU
        if: contains(github.event.inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: false
          tags: mage-ml:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
