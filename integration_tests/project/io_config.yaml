version: 0.1.1
default:
  POSTGRES_CONNECT_TIMEOUT: 10
  POSTGRES_DBNAME: "{{ env_var('MAGE_TEST_POSTGRES_DBNAME') }}"
  POSTGRES_SCHEMA: public
  POSTGRES_USER: "{{ env_var('MAGE_TEST_POSTGRES_USER') }}"
  POSTGRES_PASSWORD: "{{ env_var('MAGE_TEST_POSTGRES_PASSWORD') }}"
  POSTGRES_HOST: "{{ env_var('MAGE_TEST_POSTGRES_HOST') }}"
  POSTGRES_PORT: "{{ env_var('MAGE_TEST_POSTGRES_PORT') }}"
# The database that holds Feast's registry, offline store and online store.
feast:
  POSTGRES_CONNECT_TIMEOUT: 10
  POSTGRES_DBNAME: feast
  POSTGRES_SCHEMA: public
  POSTGRES_USER: "{{ env_var('MAGE_TEST_POSTGRES_USER') }}"
  POSTGRES_PASSWORD: "{{ env_var('MAGE_TEST_POSTGRES_PASSWORD') }}"
  POSTGRES_HOST: "{{ env_var('MAGE_TEST_POSTGRES_HOST') }}"
  POSTGRES_PORT: "{{ env_var('MAGE_TEST_POSTGRES_PORT') }}"
# The DuckDB database file of the DuckDB pipeline tests.
duckdb:
  DUCKDB_DATABASE: "{{ env_var('MAGE_TEST_DUCKDB_DATABASE') }}"
  DUCKDB_SCHEMA: main
# MinIO, for the S3 pipeline tests.
s3:
  AWS_ACCESS_KEY_ID: "{{ env_var('MAGE_TEST_S3_ACCESS_KEY') }}"
  AWS_SECRET_ACCESS_KEY: "{{ env_var('MAGE_TEST_S3_SECRET_KEY') }}"
  AWS_ENDPOINT: "{{ env_var('MAGE_TEST_S3_ENDPOINT') }}"
  AWS_REGION: us-east-1
# The MySQL database of the MySQL pipeline tests.
mysql:
  MYSQL_DATABASE: "{{ env_var('MAGE_TEST_MYSQL_DATABASE') }}"
  MYSQL_HOST: "{{ env_var('MAGE_TEST_MYSQL_HOST') }}"
  MYSQL_PASSWORD: "{{ env_var('MAGE_TEST_MYSQL_PASSWORD') }}"
  MYSQL_PORT: "{{ env_var('MAGE_TEST_MYSQL_PORT') }}"
  MYSQL_USER: "{{ env_var('MAGE_TEST_MYSQL_USER') }}"
# The schema of one test, from MAGE_TEST_SCHEMA, which the test sets. SQL blocks
# interpolate their profile, not their schema.
test_schema:
  POSTGRES_CONNECT_TIMEOUT: 10
  POSTGRES_DBNAME: "{{ env_var('MAGE_TEST_POSTGRES_DBNAME') }}"
  POSTGRES_SCHEMA: "{{ env_var('MAGE_TEST_SCHEMA') }}"
  POSTGRES_USER: "{{ env_var('MAGE_TEST_POSTGRES_USER') }}"
  POSTGRES_PASSWORD: "{{ env_var('MAGE_TEST_POSTGRES_PASSWORD') }}"
  POSTGRES_HOST: "{{ env_var('MAGE_TEST_POSTGRES_HOST') }}"
  POSTGRES_PORT: "{{ env_var('MAGE_TEST_POSTGRES_PORT') }}"
