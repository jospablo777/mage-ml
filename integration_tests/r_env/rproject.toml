[project]
name = "mage-integration-tests"
# The environment that the R blocks of the integration tests run in. It also has
# the packages that test, lint and document the mageml R package.
r_version = "4.6"

# A list of repositories to fetch packages from. Order matters: we will try to get a package from each repository in order.
# The alias is only used in this file if you want to specifically require a dependency to come from a certain repository.
# Example: { alias = "PPM", url = "https://packagemanager.posit.co/cran/latest" },
# Posit's snapshot of the day rv.lock was written: its binaries are of the locked versions.
# cran/latest has binaries of the newest only, so CI built duckdb 1.5.6 from source (47
# minutes) whenever its cache was gone. Move the date when the lock changes.
repositories = [
    {alias = "PPM", url = "https://packagemanager.posit.co/cran/2026-10-12"},
    {alias = "CRAN", url = "https://cloud.r-project.org/"},
]

# A list of packages to install and any additional configuration
# Examples:
    # "dplyr",
    # {name = "dplyr", repository = "CRAN"},
    # {name = "dplyr", git = "https://github.com/tidyverse/dplyr.git", tag = "v1.1.4"},
dependencies = [
    "tidyverse",
    "arrow",
    "bit64",
    "jsonlite",
    "tibble",
    "DBI",
    "RPostgres",
    "testthat",
    "lintr",
    "roxygen2",
    "pointblank",
    # PPM has no macOS binary of RMariaDB for R 4.6; CRAN has.
    {name = "RMariaDB", repository = "CRAN"},
    "duckdb",
    "RSQLite",
    "httr2",
    "tidymodels",
    "ranger",
    "xgboost",
    "glmnet",
    "bundle",
]
