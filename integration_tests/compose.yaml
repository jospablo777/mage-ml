# Services for the integration tests. The Makefile starts them with --wait, which
# returns once every health check passes.
name: mage-integration-tests

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_PASSWORD: test
      POSTGRES_USER: postgres
    # Test data does not need to survive a crash, so the server skips fsync and keeps
    # its data in memory.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "${MAGE_TEST_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "${MAGE_TEST_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: services/api
    ports:
      - "${MAGE_TEST_API_PORT:-18000}:8000"

  # Feast requires pandas below 3, so it runs as its own service. PostgreSQL holds its
  # registry, offline store and online store, in the feast database.
  feast:
    build: services/feast
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FEAST_PG_HOST: postgres
      FEAST_PG_PORT: "5432"
      FEAST_PG_DB: feast
      FEAST_PG_USER: postgres
      FEAST_PG_PASSWORD: test
    ports:
      - "${MAGE_TEST_FEAST_PORT:-16566}:6566"

  # MLflow tracking server with PostgreSQL as backend store and proxied artifacts.
  mlflow:
    build: services/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_PG_HOST: postgres
      MLFLOW_PG_PORT: "5432"
      MLFLOW_PG_DB: mlflow
      MLFLOW_PG_USER: postgres
      MLFLOW_PG_PASSWORD: test
    ports:
      - "${MAGE_TEST_MLFLOW_PORT:-15000}:5000"

  # S3 storage. Data lives in memory, like PostgreSQL's.
  minio:
    build: services/minio
    environment:
      MINIO_ROOT_USER: mage-test
      MINIO_ROOT_PASSWORD: mage-test-secret
    tmpfs:
      - /data
    ports:
      - "${MAGE_TEST_S3_PORT:-19000}:9000"

  # MySQL 8.4 LTS. Data lives in memory. The server's time zone is not UTC, so values
  # that go through the session time zone show it.
  mysql:
    image: mysql:8.4
    command: ["mysqld", "--default-time-zone=-06:00", "--innodb-flush-log-at-trx-commit=0"]
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: test
    tmpfs:
      - /var/lib/mysql
    ports:
      - "${MAGE_TEST_MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-ptest", "-h127.0.0.1", "-e", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # ClickHouse 25.8, an LTS release. Clients use the HTTP interface.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: mage
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_DB: test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    tmpfs:
      - /var/lib/clickhouse
    ports:
      - "${MAGE_TEST_CLICKHOUSE_PORT:-18123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Kafka 4.1 in KRaft mode, one node. Clients outside Docker use the EXTERNAL listener.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:${MAGE_TEST_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 2
    ports:
      - "${MAGE_TEST_KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 3s
      timeout: 10s
      retries: 60

  # MongoDB 8 as a single-node replica set, which transactions require. Data lives in
  # memory. Clients connect with directConnection=true, since the member's address is
  # the container's.
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    tmpfs:
      - /data/db
    ports:
      - "${MAGE_TEST_MONGODB_PORT:-17017}:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 2s
      timeout: 10s
      retries: 60
