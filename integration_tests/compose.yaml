# Services for the integration tests. The Makefile starts them with --wait, which
# returns once every health check passes.
name: mage-integration-tests

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_PASSWORD: test
      POSTGRES_USER: postgres
    # Test data does not need to survive a crash, so the server skips fsync and keeps
    # its data in memory. A smaller WAL keeps that memory down: the default let it grow
    # to 1 GB. Logical WAL is for the change data capture tests. TLS uses the
    # certificate tls_certs.py writes to .certs (make up); the server wants its key
    # owned by postgres and private, so the entrypoint copies it.
    entrypoint: ["sh", "-c", "install -o postgres -m 600 /certs/server.key /certs/server.pem /var/lib/postgresql/ && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_wal_size=128MB", "-c", "min_wal_size=32MB", "-c", "wal_level=logical", "-c", "max_replication_slots=20", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/server.pem", "-c", "ssl_key_file=/var/lib/postgresql/server.key"]
    volumes:
      - ./.certs:/certs:ro
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "${MAGE_TEST_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "${MAGE_TEST_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: services/api
    ports:
      - "${MAGE_TEST_API_PORT:-18000}:8000"

  # Feast requires pandas below 3, so it runs as its own service. PostgreSQL holds its
  # registry, offline store and online store, in the feast database.
  feast:
    build: services/feast
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FEAST_PG_HOST: postgres
      FEAST_PG_PORT: "5432"
      FEAST_PG_DB: feast
      FEAST_PG_USER: postgres
      FEAST_PG_PASSWORD: test
    ports:
      - "${MAGE_TEST_FEAST_PORT:-16566}:6566"

  # MLflow tracking server with PostgreSQL as backend store and proxied artifacts.
  mlflow:
    build: services/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_PG_HOST: postgres
      MLFLOW_PG_PORT: "5432"
      MLFLOW_PG_DB: mlflow
      MLFLOW_PG_USER: postgres
      MLFLOW_PG_PASSWORD: test
      # The job runner and its huey consumers, six processes of about 230 MB, run GenAI
      # jobs, which the tests do not use.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "${MAGE_TEST_MLFLOW_PORT:-15000}:5000"

  # S3 storage. Data lives in memory, like PostgreSQL's.
  minio:
    build: services/minio
    environment:
      MINIO_ROOT_USER: mage-test
      MINIO_ROOT_PASSWORD: mage-test-secret
    tmpfs:
      - /data
    ports:
      - "${MAGE_TEST_S3_PORT:-19000}:9000"

  # MySQL 8.4 LTS. Data lives in memory. The server's time zone is not UTC, so values
  # that go through the session time zone show it. The performance schema is off, which
  # saves memory.
  mysql:
    image: mysql:8.4
    command: ["mysqld", "--default-time-zone=-06:00", "--innodb-flush-log-at-trx-commit=0", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: test
    tmpfs:
      - /var/lib/mysql
    ports:
      - "${MAGE_TEST_MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-ptest", "-h127.0.0.1", "-e", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # ClickHouse 25.8, an LTS release. Clients use the HTTP interface.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: mage
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_DB: test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    tmpfs:
      - /var/lib/clickhouse
    volumes:
      - ./services/clickhouse/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    ports:
      - "${MAGE_TEST_CLICKHOUSE_PORT:-18123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Kafka 4.1 in KRaft mode, one node. Clients outside Docker use the EXTERNAL listener.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:${MAGE_TEST_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "${MAGE_TEST_KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 3s
      timeout: 10s
      retries: 60

  # RabbitMQ 4.3, data in memory. It sets its memory watermark from the container limit.
  # The password has characters that a URL must quote.
  rabbitmq:
    image: rabbitmq:4.3-alpine
    mem_limit: 512m
    # It exited at boot once on a CI runner; a restart is cheaper than a failed run.
    restart: on-failure:3
    environment:
      RABBITMQ_DEFAULT_USER: mage
      RABBITMQ_DEFAULT_PASS: "p@ss/w:rd%"
    # As the rabbitmq user, so the healthcheck (docker exec) runs as it too: as root, a
    # check that ran before the server wrote its Erlang cookie created the cookie readable
    # by root only, and RabbitMQ stopped at boot with "eacces" on every restart.
    user: rabbitmq
    ports:
      - "${MAGE_TEST_RABBITMQ_PORT:-15673}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 10s
      retries: 60

  # Db2 Community Edition: database TESTDB, user db2inst1. Published for amd64 only (emulated
  # elsewhere); it needs privileged mode and takes minutes to create the database.
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    platform: linux/amd64
    privileged: true
    mem_limit: 3g
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: "db2-Pass1"
      DBNAME: testdb
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
      PERSISTENT_HOME: "false"
    ports:
      - "${MAGE_TEST_DB2_PORT:-15050}:50000"
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to testdb' > /dev/null"]
      interval: 10s
      timeout: 30s
      retries: 90
      start_period: 120s

  # IBM MQ Advanced for Developers: queue manager QM1, the DEV.* queues and the app user.
  # IBM publishes the image for amd64; elsewhere it runs emulated.
  ibm-mq:
    image: icr.io/ibm-messaging/mq:9.4.5.1-r1
    platform: linux/amd64
    mem_limit: 1g
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_USER: app
      MQ_APP_PASSWORD: "p@ssw0rd"
      MQ_ADMIN_PASSWORD: "adm1nPass"
    ports:
      - "${MAGE_TEST_IBM_MQ_PORT:-11414}:1414"
      - "${MAGE_TEST_IBM_MQ_WEB_PORT:-19443}:9443"
    healthcheck:
      test: ["CMD-SHELL", "chkmqhealthy && chkmqready"]
      interval: 5s
      timeout: 10s
      retries: 60

  # NATS 2.15 with JetStream, data in memory.
  # Network faults between a stream and its broker: proxies made by the tests, cut and
  # restored through its API.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    mem_limit: 64m
    ports:
      - "${MAGE_TEST_TOXIPROXY_PORT:-18474}:8474"
      - "${MAGE_TEST_TOXIPROXY_PROXY_PORT:-18666}:8666"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 5s
      retries: 30

  nats:
    image: nats:2.15-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    mem_limit: 256m
    # Go sizes its heap by the host's memory, not the container's: under load NATS grew
    # past the limit and was killed. Its JetStream store is on tmpfs, inside it too.
    environment:
      GOMEMLIMIT: 160MiB
    tmpfs:
      - /data
    ports:
      - "${MAGE_TEST_NATS_PORT:-14222}:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 5s
      retries: 60

  # ElasticMQ, an SQS server in a native image (about 20 MB), for the SQS source.
  sqs:
    image: softwaremill/elasticmq-native:1.6.14
    mem_limit: 128m
    ports:
      - "${MAGE_TEST_SQS_PORT:-19324}:9324"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9324"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Google's Pub/Sub emulator (Java, with a heap of 160 MB), for the Pub/Sub source and sink.
  pubsub:
    image: thekevjames/gcloud-pubsub-emulator:589.0.0
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: -Xmx160m
    ports:
      - "${MAGE_TEST_PUBSUB_PORT:-18681}:8681"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8681/"]
      interval: 2s
      timeout: 5s
      retries: 60

  # OpenSearch 2.19, one node with a heap of 256 MB and security off, for the search sink.
  opensearch:
    image: opensearchproject/opensearch:2.19.3
    mem_limit: 768m
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "${MAGE_TEST_OPENSEARCH_PORT:-19200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health"]
      interval: 3s
      timeout: 5s
      retries: 80

  # InfluxDB 2.7, set up with an org, a bucket and an operator token for the stream sinks.
  influxdb:
    image: influxdb:2.7-alpine
    mem_limit: 512m
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: mage
      DOCKER_INFLUXDB_INIT_PASSWORD: mage-password
      DOCKER_INFLUXDB_INIT_ORG: mage
      DOCKER_INFLUXDB_INIT_BUCKET: data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mage-test-token
    ports:
      - "${MAGE_TEST_INFLUXDB_PORT:-18086}:8086"
    healthcheck:
      test: ["CMD-SHELL", "influx ping --host http://127.0.0.1:8086"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Apache Pinot's quickstart (ZooKeeper, controller, broker, server and minion in one JVM)
  # with a heap of 1 GB, on Amazon Corretto. The controller takes schemas, tables and files;
  # MageML queries the broker.
  pinot:
    image: apachepinot/pinot:1.4.0-21-amazoncorretto
    mem_limit: 1600m
    command: ["QuickStart", "-type", "EMPTY"]
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1g"
    ports:
      - "${MAGE_TEST_PINOT_CONTROLLER_PORT:-19900}:9000"
      - "${MAGE_TEST_PINOT_BROKER_PORT:-18999}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health && curl -sf http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  # ActiveMQ Classic 6.2 with a heap of 256 MB. Mage's ActiveMQ source and sink use STOMP.
  activemq:
    image: apache/activemq-classic:6.2.0
    mem_limit: 640m
    environment:
      ACTIVEMQ_OPTS: "-Xms64M -Xmx256M -Djava.util.logging.config.file=logging.properties -Djava.security.auth.login.config=/opt/apache-activemq/conf/login.config -Djetty.host=0.0.0.0"
    ports:
      - "${MAGE_TEST_ACTIVEMQ_PORT:-16613}:61613"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/61613'"]
      interval: 3s
      timeout: 5s
      retries: 60

  # Trino 483, one node with a heap of 768 MB. Catalogs: memory; iceberg, with tables in
  # MinIO and the catalog in PostgreSQL; delta, with tables and a file metastore in MinIO.
  # The memory limit keeps the JVM from taking memory from the other services. glibc
  # gave each of its threads a malloc arena, which held about 700 MB outside the heap.
  trino:
    build: services/trino
    mem_limit: 2g
    environment:
      MALLOC_ARENA_MAX: "2"
    depends_on:
      trino-setup:
        condition: service_completed_successfully
    ports:
      - "${MAGE_TEST_TRINO_PORT:-18080}:8080"

  # Creates the PostgreSQL database and the MinIO bucket of Trino's catalogs.
  trino-setup:
    build: services/trino/setup
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # MongoDB 8 as a single-node replica set, which transactions require. Data lives in
  # memory. Clients connect with directConnection=true, since the member's address is
  # the container's.
  # MongoDB 8 refuses to start on Linux 6.19 or newer (its allocator breaks the rseq ABI,
  # SERVER-121912), which some CI runners have; 7.0 is not affected and has change streams.
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    tmpfs:
      - /data/db
    ports:
      - "${MAGE_TEST_MONGODB_PORT:-17017}:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 2s
      timeout: 10s
      retries: 60
