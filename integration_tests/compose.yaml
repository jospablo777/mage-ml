# Services for the integration tests. The Makefile starts them with --wait, which
# returns once every health check passes.
name: mage-integration-tests

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_PASSWORD: test
      POSTGRES_USER: postgres
    # Test data does not need to survive a crash, so the server skips fsync and keeps
    # its data in memory. A smaller WAL keeps that memory down: the default let it grow
    # to 1 GB. Logical WAL is for the change data capture tests.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_wal_size=128MB", "-c", "min_wal_size=32MB", "-c", "wal_level=logical", "-c", "max_replication_slots=20"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "${MAGE_TEST_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "${MAGE_TEST_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: services/api
    ports:
      - "${MAGE_TEST_API_PORT:-18000}:8000"

  # Feast requires pandas below 3, so it runs as its own service. PostgreSQL holds its
  # registry, offline store and online store, in the feast database.
  feast:
    build: services/feast
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FEAST_PG_HOST: postgres
      FEAST_PG_PORT: "5432"
      FEAST_PG_DB: feast
      FEAST_PG_USER: postgres
      FEAST_PG_PASSWORD: test
    ports:
      - "${MAGE_TEST_FEAST_PORT:-16566}:6566"

  # MLflow tracking server with PostgreSQL as backend store and proxied artifacts.
  mlflow:
    build: services/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_PG_HOST: postgres
      MLFLOW_PG_PORT: "5432"
      MLFLOW_PG_DB: mlflow
      MLFLOW_PG_USER: postgres
      MLFLOW_PG_PASSWORD: test
      # The job runner and its huey consumers, six processes of about 230 MB, run GenAI
      # jobs, which the tests do not use.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "${MAGE_TEST_MLFLOW_PORT:-15000}:5000"

  # S3 storage. Data lives in memory, like PostgreSQL's.
  minio:
    build: services/minio
    environment:
      MINIO_ROOT_USER: mage-test
      MINIO_ROOT_PASSWORD: mage-test-secret
    tmpfs:
      - /data
    ports:
      - "${MAGE_TEST_S3_PORT:-19000}:9000"

  # MySQL 8.4 LTS. Data lives in memory. The server's time zone is not UTC, so values
  # that go through the session time zone show it. The performance schema is off, which
  # saves memory.
  mysql:
    image: mysql:8.4
    command: ["mysqld", "--default-time-zone=-06:00", "--innodb-flush-log-at-trx-commit=0", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: test
    tmpfs:
      - /var/lib/mysql
    ports:
      - "${MAGE_TEST_MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-ptest", "-h127.0.0.1", "-e", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # ClickHouse 25.8, an LTS release. Clients use the HTTP interface.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: mage
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_DB: test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    tmpfs:
      - /var/lib/clickhouse
    volumes:
      - ./services/clickhouse/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    ports:
      - "${MAGE_TEST_CLICKHOUSE_PORT:-18123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Kafka 4.1 in KRaft mode, one node. Clients outside Docker use the EXTERNAL listener.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:${MAGE_TEST_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "${MAGE_TEST_KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 3s
      timeout: 10s
      retries: 60

  # RabbitMQ 4.3, data in memory. It sets its memory watermark from the container limit.
  # The password has characters that a URL must quote.
  rabbitmq:
    image: rabbitmq:4.3-alpine
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: mage
      RABBITMQ_DEFAULT_PASS: "p@ss/w:rd%"
    tmpfs:
      - /var/lib/rabbitmq
    ports:
      - "${MAGE_TEST_RABBITMQ_PORT:-15673}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 10s
      retries: 60

  # NATS 2.15 with JetStream, data in memory.
  nats:
    image: nats:2.15-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    mem_limit: 256m
    tmpfs:
      - /data
    ports:
      - "${MAGE_TEST_NATS_PORT:-14222}:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 5s
      retries: 60

  # ActiveMQ Classic 6.2 with a heap of 256 MB. Mage's ActiveMQ source and sink use STOMP.
  activemq:
    image: apache/activemq-classic:6.2.0
    mem_limit: 640m
    environment:
      ACTIVEMQ_OPTS: "-Xms64M -Xmx256M -Djava.util.logging.config.file=logging.properties -Djava.security.auth.login.config=/opt/apache-activemq/conf/login.config -Djetty.host=0.0.0.0"
    ports:
      - "${MAGE_TEST_ACTIVEMQ_PORT:-16613}:61613"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/61613'"]
      interval: 3s
      timeout: 5s
      retries: 60

  # Trino 483, one node with a heap of 768 MB. Catalogs: memory; iceberg, with tables in
  # MinIO and the catalog in PostgreSQL; delta, with tables and a file metastore in MinIO.
  # The memory limit keeps the JVM from taking memory from the other services. glibc
  # gave each of its threads a malloc arena, which held about 700 MB outside the heap.
  trino:
    build: services/trino
    mem_limit: 2g
    environment:
      MALLOC_ARENA_MAX: "2"
    depends_on:
      trino-setup:
        condition: service_completed_successfully
    ports:
      - "${MAGE_TEST_TRINO_PORT:-18080}:8080"

  # Creates the PostgreSQL database and the MinIO bucket of Trino's catalogs.
  trino-setup:
    build: services/trino/setup
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # MongoDB 8 as a single-node replica set, which transactions require. Data lives in
  # memory. Clients connect with directConnection=true, since the member's address is
  # the container's.
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    tmpfs:
      - /data/db
    ports:
      - "${MAGE_TEST_MONGODB_PORT:-17017}:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 2s
      timeout: 10s
      retries: 60
