# Delta Lake tables in MinIO, with a file metastore next to them.
connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=s3://trino-warehouse/delta-metastore
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=mage-test
s3.aws-secret-key=mage-test-secret
