project: mage_it
provider: local
registry:
  registry_type: sql
  path: postgresql+psycopg://${FEAST_PG_USER}:${FEAST_PG_PASSWORD}@${FEAST_PG_HOST}:${FEAST_PG_PORT}/${FEAST_PG_DB}
  cache_ttl_seconds: 5
online_store:
  type: postgres
  host: ${FEAST_PG_HOST}
  port: ${FEAST_PG_PORT}
  database: ${FEAST_PG_DB}
  db_schema: feast_online
  user: ${FEAST_PG_USER}
  password: ${FEAST_PG_PASSWORD}
  # The test server has no TLS; Feast requires it by default.
  sslmode: disable
  # The default, singleton, shares one connection between the server's request threads;
  # with 16 concurrent requests most reads and pushes failed with 500.
  conn_type: pool
  min_conn: 1
  max_conn: 20
offline_store:
  type: postgres
  host: ${FEAST_PG_HOST}
  port: ${FEAST_PG_PORT}
  database: ${FEAST_PG_DB}
  db_schema: public
  user: ${FEAST_PG_USER}
  password: ${FEAST_PG_PASSWORD}
  sslmode: disable
entity_key_serialization_version: 3
