# Builds the service image for amd64 and arm64 on every push to main, and pushes it when the
# repository sets a registry. Settings > Secrets and variables > Actions:
#   variable REGISTRY_IMAGE  for example icr.io/team/$name, docker.io/team/$name,
#                            ghcr.io/owner/$name
#   secret REGISTRY_USERNAME and REGISTRY_PASSWORD
#                            IBM Cloud: iamapikey and an API key; Docker Hub: your user and
#                            an access token. ghcr.io needs neither: without them the job
#                            logs in with the workflow's GITHUB_TOKEN.
# Pin the actions to commit SHAs if your organization requires it.
name: Build $name

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Find the registry
        id: registry
        if: env.REGISTRY_IMAGE != ''
        run: |
          host="${REGISTRY_IMAGE%%/*}"
          case "$host" in *.*|*:*|localhost) ;; *) host=docker.io ;; esac
          echo "host=$host" >> "$GITHUB_OUTPUT"
      - name: Log in to the registry
        if: env.REGISTRY_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.REGISTRY_IMAGE != '' }}
          tags: |
            ${{ env.REGISTRY_IMAGE || '$name' }}:${{ github.sha }}
            ${{ env.REGISTRY_IMAGE || '$name' }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
