# Triggers for the toolchain: add a manual trigger and a Git trigger that use the
# $name-listener event listener.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: $name-template
spec:
  params:
    - name: repository
    - name: branch
      default: main
    - name: git-token
      default: ""
    - name: context-dir
      default: "."
    - name: apikey
    - name: region
      default: us-south
    - name: resource-group
      default: Default
    - name: registry-namespace
    - name: image-name
      default: $name
    - name: code-engine-project
    - name: app-name
      default: $name
    - name: env-secret
      default: ""
    - name: trusted-profile
      default: ""
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: $name-run-
      spec:
        pipelineRef:
          name: $name-pipeline
        params:
          - {name: repository, value: $(params.repository)}
          - {name: branch, value: $(params.branch)}
          - {name: git-token, value: $(params.git-token)}
          - {name: context-dir, value: $(params.context-dir)}
          - {name: apikey, value: $(params.apikey)}
          - {name: region, value: $(params.region)}
          - {name: resource-group, value: $(params.resource-group)}
          - {name: registry-namespace, value: $(params.registry-namespace)}
          - {name: image-name, value: $(params.image-name)}
          - {name: code-engine-project, value: $(params.code-engine-project)}
          - {name: app-name, value: $(params.app-name)}
          - {name: env-secret, value: $(params.env-secret)}
          - {name: trusted-profile, value: $(params.trusted-profile)}
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 2Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: $name-binding
spec:
  # The toolchain's environment properties fill the template's params by name.
  params: []
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: $name-listener
spec:
  triggers:
    - bindings:
        - ref: $name-binding
      template:
        ref: $name-template
