# IBM Cloud Continuous Delivery: build the service image, push it to IBM Cloud Container
# Registry and deploy it to Code Engine. The pipeline's properties set the params; see
# deploy/ibm/README.md.
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: $name-pipeline
spec:
  params:
    - name: repository
      description: Git URL of the repository that holds this export
    - name: branch
      default: main
    - name: git-token
      description: Token for a private repository; empty for a public one
      default: ""
    - name: context-dir
      description: Folder of this export in the repository
      default: "."
    - name: apikey
      description: IBM Cloud API key that can push images and deploy to Code Engine
    - name: region
      default: us-south
    - name: resource-group
      default: Default
    - name: registry-namespace
      description: IBM Cloud Container Registry namespace
    - name: image-name
      default: $name
    - name: code-engine-project
    - name: app-name
      default: $name
    - name: env-secret
      description: Code Engine secret with the service's variables; empty for none
      default: ""
    - name: trusted-profile
      description: Trusted profile the app uses to read IBM Secrets Manager; empty for none
      default: ""
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        name: $name-clone
      params:
        - name: repository
          value: $(params.repository)
        - name: branch
          value: $(params.branch)
        - name: git-token
          value: $(params.git-token)
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter: [clone]
      taskRef:
        name: $name-build
      params:
        - name: context-dir
          value: $(params.context-dir)
        - name: apikey
          value: $(params.apikey)
        - name: region
          value: $(params.region)
        - name: registry-namespace
          value: $(params.registry-namespace)
        - name: image-name
          value: $(params.image-name)
        - name: commit
          value: $(tasks.clone.results.commit)
      workspaces:
        - name: source
          workspace: source
    - name: deploy
      runAfter: [build]
      taskRef:
        name: $name-deploy
      params:
        - name: apikey
          value: $(params.apikey)
        - name: region
          value: $(params.region)
        - name: resource-group
          value: $(params.resource-group)
        - name: code-engine-project
          value: $(params.code-engine-project)
        - name: app-name
          value: $(params.app-name)
        - name: image
          value: $(tasks.build.results.image)
        - name: env-secret
          value: $(params.env-secret)
        - name: trusted-profile
          value: $(params.trusted-profile)
