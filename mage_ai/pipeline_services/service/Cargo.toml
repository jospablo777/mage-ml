[workspace]
members = ["crates/core", "crates/stream-core", "crates/stream-ports", "crates/connector-local", "crates/connector-kafka", "crates/connector-http", "crates/connector-rabbitmq", "crates/connector-ibmmq", "crates/connector-objectstore", "crates/service", "crates/console"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
