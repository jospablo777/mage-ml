[package]
name = "mage-connector-rabbitmq"
description = "RabbitMQ source and sink for Mage pipeline service streams, through lapin (pure Rust AMQP)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros"] }
lapin = { version = "4", default-features = false, features = ["default-runtime", "rustls", "rustls--ring"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
