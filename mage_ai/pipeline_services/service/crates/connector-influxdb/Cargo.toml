[package]
name = "mage-connector-influxdb"
description = "InfluxDB 2 sink for Mage pipeline service streams: line protocol over HTTP, exact integers, distinct times for messages without one"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-ports = { path = "../stream-ports" }
serde.workspace = true
serde_json.workspace = true
# The HTTP client of the object storage sink.
object_store = { version = "0.14", default-features = false, features = ["http"] }
http = "1"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
