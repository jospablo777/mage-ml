[package]
name = "mage-connector-objectstore"
description = "Object storage sink for Mage pipeline service streams: Parquet or JSON lines on S3, Google Cloud Storage, Azure Blob Storage, S3-compatible stores and local disk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
mage-service-core = { path = "../core" }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros"] }
object_store = { version = "0.14", default-features = false, features = ["aws", "gcp", "azure", "fs"] }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
arrow-json = { version = "60", default-features = false }
url = "2"
bytes = "1"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
tempfile = "3"
