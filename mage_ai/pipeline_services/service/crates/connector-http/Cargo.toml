[package]
name = "mage-connector-http"
description = "HTTP stream connectors: a webhook source that answers once the sinks confirm, and an HTTP sink"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros"] }
# HMAC-SHA256 with constant-time verification; already in the tree through rustls.
ring = "0.17"
# The HTTP sink's client; already in the tree for secret managers.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
