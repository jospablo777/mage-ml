[package]
name = "mage-ledger"
description = "The run history of Mage pipeline services: runs, block runs, schedule occurrences and settings in SQLite or PostgreSQL, with instance leases"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-service-core = { path = "../core" }
mage-log = { path = "../log" }
mage-pg = { path = "../pg" }
serde_json.workspace = true
thiserror.workspace = true
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1.47", features = ["rt"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
