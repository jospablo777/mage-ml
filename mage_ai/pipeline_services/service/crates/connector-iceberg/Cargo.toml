[package]
name = "mage-connector-iceberg"
description = "Apache Iceberg sink for Mage pipeline service streams, over a REST catalog"
version.workspace = true
edition.workspace = true
# iceberg-rust 0.11 needs 1.95.
rust-version = "1.95"
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
# iceberg 0.11 is on Arrow 58 (the engine is on 60): messages decode straight into Arrow 58
# with the table's schema (ADR-0042).
iceberg = "0.11"
iceberg-catalog-rest = "0.11"
arrow-array = { version = "58.4", default-features = false }
arrow-json = { version = "58.4", default-features = false }
arrow-schema = { version = "58.4", default-features = false }
parquet = { version = "58.4", default-features = false, features = ["arrow", "zstd"] }
object_store = { version = "0.14", default-features = false, features = ["aws", "gcp", "azure", "fs"] }
async-trait = "0.1"
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
typetag = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros"] }
