[package]
name = "mage-connector-sqs"
description = "Amazon SQS source for Mage pipeline service streams: concurrent long polls, deletes after the sinks, visibility kept while a batch runs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros"] }
# The AWS credential chain (environment, web identity, ECS, instance metadata) and SigV4 of the
# object storage sink, so S3 and SQS authenticate the same way.
object_store = { version = "0.14", default-features = false, features = ["aws"] }
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
