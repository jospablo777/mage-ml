[package]
name = "mage-connector-search"
description = "Elasticsearch and OpenSearch sink for Mage pipeline service streams: bulk writes, document ids from a message field, API keys, basic auth or AWS SigV4"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros"] }
# The HTTP client, AWS credentials and SigV4 of the object storage sink.
object_store = { version = "0.14", default-features = false, features = ["aws"] }
http = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
