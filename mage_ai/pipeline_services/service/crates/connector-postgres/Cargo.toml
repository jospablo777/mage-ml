[package]
name = "mage-connector-postgres"
description = "PostgreSQL sink for Mage pipeline service streams: exact values through jsonb, upserts, tables made and extended from the messages"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
serde_json = { workspace = true }
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
