[package]
name = "mage-connector-pubsub"
description = "Google Cloud Pub/Sub source and sink for Mage pipeline service streams: concurrent pulls, acknowledgements after the sinks, ack deadlines kept while a batch runs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros"] }
# The Google credential chain (GOOGLE_APPLICATION_CREDENTIALS, application default
# credentials, the metadata server) of the object storage sink, so GCS and Pub/Sub
# authenticate the same way.
object_store = { version = "0.14", default-features = false, features = ["gcp"] }
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
