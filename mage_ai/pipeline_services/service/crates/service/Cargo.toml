[package]
name = "mage-service"
description = "Runs pipelines exported from Mage: HTTP API, schedules, run history and block execution"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-service-core = { path = "../core" }
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
mage-connector-local = { path = "../connector-local" }
mage-connector-http = { path = "../connector-http" }
# Kafka streams (librdkafka, built with cmake); exports turn it on when a stream uses Kafka.
mage-connector-kafka = { path = "../connector-kafka", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
rusqlite = { version = "0.37", features = ["bundled"] }
croner = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
tokio-util = { version = "0.7", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# SigV4 for AWS secrets; both are already in the tree through rustls and ureq.
ring = "0.17"
base64 = "0.22"
# Frame outputs (Arrow IPC files) served as JSON rows; R writes them LZ4-compressed.
arrow-array = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false, features = ["lz4", "zstd"] }
arrow-json = { version = "60", default-features = false }

[features]
kafka = ["dep:mage-connector-kafka"]

[dev-dependencies]
tempfile = "3"
