[package]
name = "mage-service"
description = "Runs pipelines exported from Mage: HTTP API, schedules, run history and block execution"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-service-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
rusqlite = { version = "0.37", features = ["bundled"] }
croner = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
tempfile = "3"
