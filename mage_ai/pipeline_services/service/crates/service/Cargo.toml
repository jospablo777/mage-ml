[package]
name = "mage-service"
description = "Runs pipelines exported from Mage: HTTP API, schedules, run history and block execution"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-service-core = { path = "../core" }
mage-log = { path = "../log" }
mage-ledger = { path = "../ledger" }
mage-log-window = { path = "../log-window" }
mage-pg = { path = "../pg" }
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
mage-connector-local = { path = "../connector-local" }
mage-connector-http = { path = "../connector-http" }
# Kafka streams (librdkafka, built with cmake); exports turn it on when a stream uses Kafka.
mage-connector-kafka = { path = "../connector-kafka", optional = true }
# RabbitMQ streams (lapin, pure Rust); exports turn it on when a stream uses RabbitMQ.
mage-connector-rabbitmq = { path = "../connector-rabbitmq", optional = true }
mage-connector-nats = { path = "../connector-nats", optional = true }
mage-connector-mongodb = { path = "../connector-mongodb", optional = true }
mage-connector-ibmmq = { path = "../connector-ibmmq", optional = true }
mage-connector-objectstore = { path = "../connector-objectstore", optional = true }
# Always built: the run history can be PostgreSQL in any image (MAGE_SERVICE_LEDGER_URL).
mage-connector-postgres = { path = "../connector-postgres" }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-chrono-0_4"] }
bytes = "1"
mage-connector-clickhouse = { path = "../connector-clickhouse", optional = true }
mage-connector-sqs = { path = "../connector-sqs", optional = true }
mage-connector-pubsub = { path = "../connector-pubsub", optional = true }
mage-connector-activemq = { path = "../connector-activemq", optional = true }
mage-connector-search = { path = "../connector-search", optional = true }
mage-connector-influxdb = { path = "../connector-influxdb", optional = true }
# Data contracts on block outputs, checked by the checker of MageML runs; exports turn it
# on when a block has a contract. It builds Polars.
mage-checks = { path = "../checks", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync", "fs", "io-util", "io-std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
rusqlite = { version = "0.37", features = ["bundled"] }
croner = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
tokio-util = { version = "0.7", default-features = false }
# The gateway in front of MageML's web server (gateway.rs); all three are in the tree
# through axum.
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# Pipeline tags from metadata.yaml, for the gateway's pipeline runs list.
yaml-rust2 = "0.13"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# SigV4 for AWS secrets; both are already in the tree through rustls and ureq.
ring = "0.17"
base64 = "0.22"
# Frame outputs (Arrow IPC files) served as JSON rows; R writes them LZ4-compressed.
arrow-array = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false, features = ["lz4", "zstd"] }
arrow-json = { version = "60", default-features = false }
arrow-select = { version = "60", default-features = false }

[features]
kafka = ["dep:mage-connector-kafka"]
rabbitmq = ["dep:mage-connector-rabbitmq"]
nats = ["dep:mage-connector-nats"]
mongodb = ["dep:mage-connector-mongodb"]
# Loads IBM's MQ client library at runtime; building needs no IBM SDK.
ibm-mq = ["dep:mage-connector-ibmmq"]
# Object storage sinks: S3 and compatible stores, GCS, Azure Blob, local disk.
object-store = ["dep:mage-connector-objectstore"]
# PostgreSQL sinks.
postgres = []
# ClickHouse sinks.
clickhouse = ["dep:mage-connector-clickhouse"]
sqs = ["dep:mage-connector-sqs"]
pubsub = ["dep:mage-connector-pubsub"]
activemq = ["dep:mage-connector-activemq"]
search = ["dep:mage-connector-search"]
influxdb = ["dep:mage-connector-influxdb"]
checks = ["dep:mage-checks"]
# The standard connectors: the engine the mageml-engine wheel ships (ADR-0017).
full = [
    "kafka", "rabbitmq", "nats", "mongodb", "ibm-mq", "object-store", "postgres", "clickhouse",
    "sqs", "pubsub", "activemq", "search", "influxdb",
]

[dev-dependencies]
tempfile = "3"
