[package]
name = "mage-connector-ibmmq"
description = "IBM MQ source and sink for Mage pipeline service streams, through IBM's MQ client loaded at runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros"] }
ring = "0.17"
# The MQ client library (libmqm_r) is loaded at runtime, so the engine builds without IBM's
# SDK and only images whose streams use IBM MQ carry it. Pinned: the crate is pre-1.0.
mqi = { version = "=0.3.0", default-features = false, features = ["dlopen2", "mqai"] }
libmqm-sys = { version = "=0.10.2", default-features = false, features = ["dlopen2"] }
dlopen2 = "0.8"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
