[package]
name = "mage-stream-ports"
description = "The ports of stream processing in Mage pipeline services: sources, sinks, transform sessions and the Arrow envelope of a batch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Layer 1 ports with the ADR-0028 exception: Arrow arrays and schema only; no tokio, no I/O.
[dependencies]
mage-stream-core = { path = "../stream-core" }
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
arrow-buffer = { version = "60", default-features = false }
