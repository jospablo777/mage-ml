[package]
name = "mage-connector-activemq"
description = "ActiveMQ source and sink for Mage pipeline service streams, over STOMP: acknowledgements after the sinks, persistent sends confirmed by receipts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
bytes = "1"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
