[package]
name = "mage-connector-clickhouse"
description = "ClickHouse sink for Mage pipeline service streams, over ClickHouse's HTTP interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mage-stream-core = { path = "../stream-core" }
mage-stream-ports = { path = "../stream-ports" }
serde_json = { workspace = true }
tokio = { version = "1.47", features = ["rt", "sync"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros"] }
