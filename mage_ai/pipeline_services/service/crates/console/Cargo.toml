[package]
name = "mage-console"
description = "Terminal console of Mage pipeline services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mage_console"
path = "src/lib.rs"

[[bin]]
name = "mage-console"
path = "src/main.rs"

[dependencies]
mage-service-core = { path = "../core" }
serde_json.workspace = true
ratatui = "=0.29.0"
crossterm = "=0.28.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
signal-hook = "0.3"
