connector_type: kafka
bootstrap_server: "localhost:9092"
topic: topic_name
# Mage detects the broker's protocol version. Set api_version only for old brokers;
# 0.10.2, which this template set, fails against Kafka 4.
# api_version: 2.8.0

# Uncomment the config below to use SSL config
# security_protocol: "SSL"
# ssl_config:
#   cafile: "CARoot.pem"
#   certfile: "certificate.pem"
#   keyfile: "key.pem"
#   password: password
#   check_hostname: true

# Uncomment the config below to use SASL_SSL config
# security_protocol: "SASL_SSL"
# sasl_config:
#   mechanism: "PLAIN"
#   username: username
#   password: password
