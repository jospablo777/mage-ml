[package]
name = "mage-block"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Runtime of Mage Rust blocks: inputs, outputs, tests and errors"
publish = false

[lib]
name = "mage"

[dependencies]
anyhow = "1"
polars = { version = "=0.55.2", default-features = false, features = [
  "lazy", "parquet", "ipc", "json", "csv", "strings", "temporal", "timezones", "dtype-full",
  "streaming", "performant", "is_in", "round_series", "cum_agg", "abs", "rank", "regex",
  "concat_str", "pivot", "fmt",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PostgreSQL for blocks (mage::postgres), behind the postgres feature: enable it in the
# project's rust/Cargo.toml with mage-block = { path = ".mage/sdk", features = ["postgres"] }.
postgres = { version = "0.19", optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[features]
postgres = ["dep:postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots"]

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
