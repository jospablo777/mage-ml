[package]
name = "mage-block"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Runtime of Mage Rust blocks: inputs, outputs, tests and errors"
publish = false

[lib]
name = "mage"

[dependencies]
anyhow = "1"
polars = { version = "=0.55.2", default-features = false, features = [
  "lazy", "parquet", "ipc", "json", "csv", "strings", "temporal", "timezones", "dtype-full", "log",
  "streaming", "performant", "is_in", "round_series", "cum_agg", "abs", "rank", "regex",
  "concat_str", "pivot", "fmt",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PostgreSQL for blocks (mage::postgres), behind the postgres feature: enable it in the
# project's rust/Cargo.toml with mage-block = { path = ".mage/sdk", features = ["postgres"] }.
postgres = { version = "0.19", optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
# Feast's feature server REST API for blocks (mage::feast), behind the feast feature.
ureq = { version = "3", features = ["json"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }
# ONNX models for blocks (mage::onnx), behind the onnx feature. ONNX Runtime is downloaded
# at build time and linked into the block's program.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls"], optional = true }

[features]
# Object storage for blocks (mage::storage): S3 and S3-compatible stores, Google Cloud Storage
# and Azure Blob Storage, through Polars' own cloud readers and writers.
storage = ["polars/aws", "polars/gcp", "polars/azure"]
# ClickHouse for blocks (mage::clickhouse), over HTTP with rows in Arrow.
clickhouse = ["dep:ureq", "polars/ipc_streaming"]
postgres = ["dep:postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots"]
feast = ["dep:ureq", "dep:chrono"]
onnx = ["dep:ort"]

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
