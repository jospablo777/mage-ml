[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "column-atlas-native"
version = "0.2.0"
description = "Native code of MageML: ColumnAtlas Parquet queries and profiles, PostgreSQL binary COPY, log windows"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.maturin]
module-name = "column_atlas_native"
features = ["extension-module", "postgres"]
profile = "release"
# Without debug symbols the wheel is several times smaller.
strip = true

# uv rebuilds the extension when any of these change, not only pyproject.toml.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "rust-toolchain.toml" },
  { file = "src/**/*.rs" },
  # The PostgreSQL client comes from the Rust block SDK (the postgres feature).
  { file = "../../mage_ai/data_preparation/models/block/rust/sdk/Cargo.toml" },
  { file = "../../mage_ai/data_preparation/models/block/rust/sdk/src/**/*.rs" },
]
