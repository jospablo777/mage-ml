[package]
name = "column_atlas_native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native code of MageML: ColumnAtlas Parquet queries and profiles, PostgreSQL binary COPY, log windows"
publish = false

[lib]
name = "column_atlas_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module", "pyo3/abi3-py312"]
# PostgreSQL through binary COPY for Python blocks: the Rust blocks' client (src/postgres.rs).
postgres = ["dep:mage-block", "polars/ipc", "polars/ipc_streaming"]

[dependencies]
polars = { version = "=0.55.2", default-features = false, features = [
  "lazy", "parquet", "strings", "round_series", "is_in", "cum_agg", "abs",
  "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16", "dtype-i128", "dtype-date", "dtype-datetime",
  "dtype-duration", "dtype-time", "dtype-decimal", "dtype-categorical", "dtype-struct",
  "dtype-array", "dtype-extension", "temporal", "timezones", "fmt", "approx_unique", "propagate_nans",
  "row_hash", "semi_anti_join", "streaming", "performant", "is_between", "dtype-u128",
  "is_unique", "concat_str", "regex", "ipc",
] }
pyo3 = { version = "0.29", optional = true }
mage-block = { path = "../../mage_ai/data_preparation/models/block/rust/sdk", features = ["postgres"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Data contracts and monitors: the checks of the engine's workspace, which exported services
# use too.
mage-checks = { path = "../../mage_ai/pipeline_services/service/crates/checks" }
mage-log-window = { path = "../../mage_ai/pipeline_services/service/crates/log-window" }
memchr = "2"
# Keyed hashes of masked development copies (src/mask.rs).
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "unwind"
