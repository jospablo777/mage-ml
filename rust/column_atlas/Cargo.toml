[package]
name = "column_atlas_native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Read-only Parquet queries for ColumnAtlas, the block output explorer of Mage"
publish = false

[lib]
name = "column_atlas_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module", "pyo3/abi3-py311"]

[dependencies]
polars = { version = "=0.55.2", default-features = false, features = [
  "lazy", "parquet", "strings", "round_series", "is_in", "cum_agg", "abs",
  "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16", "dtype-i128", "dtype-date", "dtype-datetime",
  "dtype-duration", "dtype-time", "dtype-decimal", "dtype-categorical", "dtype-struct",
  "dtype-array", "dtype-extension", "temporal", "timezones", "fmt", "approx_unique", "propagate_nans",
  "row_hash", "semi_anti_join", "streaming", "performant", "is_between", "dtype-u128",
  "is_unique", "concat_str", "regex",
] }
pyo3 = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "unwind"
